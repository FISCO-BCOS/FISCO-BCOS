# run_oprevm — op-revm 20.0.0 DA/operator-fee matrix runner (Task 5).
#
# Build (rust 1.94+ required by op-revm workspace):
#   cargo +1.94 build --release
# Run:
#   ./target/release/run_oprevm --grid <da_matrix.json> --out out_oprevm.json
#
# Depends on the local op-revm 20.0.0 checkout (the OP Foundation revm fork that
# carries JOVIAN/KARST OpSpecId and the deposit 0x7E gate — revm 19.4.0 has
# neither). First build pulls the revm 40 workspace deps and is slow (10-20 min).

[package]
name = "run_oprevm"
version = "0.1.0"
edition = "2021"
description = "op-revm DA/operator-fee grid runner for the FISCO opstack da-matrix"
publish = false

[dependencies]
# Pinned to the enforced op-revm revision (tools/.ci/check-ci-pins.sh Axis 2 and
# tools/op-revm-oracle/extract.sh both carry the same OP_REVM_PIN). rust/ is
# byte-identical at this revision and the goldens' original generation revision
# (verified: `git diff <golden-rev> 5f90f749 -- rust/` is empty), so the goldens in
# ../golden/oprevm/ are what a regeneration here produces.
# For an offline regeneration against a local monorepo checkout, override with a
# [patch] section or point the dependency at your checkout path instead:
#   [patch."https://github.com/ethereum-optimism/optimism"]
#   op-revm = { path = "<your monorepo>/rust/op-revm" }
# WARNING (review F12, 2026-10-12): the rev below is NO LONGER FETCHABLE from
# ethereum-optimism/optimism (upload-pack: "not our ref") — a fresh `cargo build`
# against this manifest fails at fetch. The committed Cargo.lock was generated
# under the [patch] path override and does not pin this source either. To
# regenerate: point rev at da197e45ed44b9fca258b3b0d0709e8dfca1c7cd (rust/ is
# byte-identical per the audit) IN THE SAME CHANGE as the pin chain
# (tools/.ci/check-ci-pins.sh Axis 2, tools/op-revm-oracle/extract.sh, the
# oracle json's source.revision), then `cargo generate-lockfile` + build +
# re-run the grid against the committed golden (must be byte-identical).
op-revm = { git = "https://github.com/ethereum-optimism/optimism", rev = "5f90f749caea14398554afb75062f7111b1fc554", version = "=20.0.0" }
serde_json = "1"

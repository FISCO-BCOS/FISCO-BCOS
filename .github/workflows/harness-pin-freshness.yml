name: harness-pin-freshness

# Weekly check that the op-stack-e2e-tests pins used by our workflows are not stale
# relative to the harness repo's blessed heads. Policy (decided 2026-09-17): the pins
# are STABLE COMMITS, bumped manually — reproducibility and coordinated two-sided
# changes (harness config requiring new engine support) outrank automatic follow. This
# job is the "forgot to bump" backstop: when a blessed head moved and the pin no
# longer matches, it opens an issue naming every stale spot; it never edits pins by
# itself.
#
# Two blessed heads, one per consumer class:
#   t8n corpus (vectors + generator + regen action)
#     -> feat/real-derivation-pipeline tip
#        consumed by workflow.yml (symlink + regen action) and
#        opstack-fork-nightly.yml (corpus checkout + regen action)
#   C2 full-stack harness (tools/op-e2e + tools/opstack-genesis)
#     -> main tip (PR squash heads land here)
#        consumed by c2-e2e.yml
#
# A stale pin is EXPECTED between "harness fix merged" and "FISCO-side bump" — the
# issue is the reminder that closes that window, and its body carries the exact
# one-line ref change for whoever does the bump.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC, before the work week's PRs
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Compare pins against the harness's blessed heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_REPO: FISCO-BCOS/op-stack-e2e-tests
          T8N_BLESSED: feat/real-derivation-pipeline
          C2_BLESSED: main
        run: |
          set -euo pipefail
          stale_json=""
          check_class() { # <class> <pinned-ref> <blessed-branch>
            local class="$1" pinned="$2" blessed="$3"
            local head
            head=$(gh api "repos/$HARNESS_REPO/commits/$blessed" --jq '.sha')
            if [ "$pinned" != "$head" ]; then
              echo "STALE: $class pin $pinned != $blessed@$head"
              stale_json="$stale_json{\"class\":\"$class\",\"pinned\":\"$pinned\",\"head\":\"$head\"},"
            else
              echo "fresh: $class @ ${pinned:0:9}"
            fi
          }
          # Gather every distinct pin per consumer class, scoped to corpus-semantic
          # lines only: the regen action reference and checkouts of the harness repo
          # itself. A blanket 40-hex grep also collected the ethereum-optimism/specs
          # ref and the op-geth oracle pin, which never track this blessed head —
          # permanent false positives. (weekly.yml is scanned too: it pins the same
          # corpus and used to escape this check.)
          WF_T8N=".github/workflows/workflow.yml .github/workflows/opstack-fork-nightly.yml .github/workflows/opstack-fork-weekly.yml"
          # The checkout-scoped grep must not capture the c2_e2e job's harness ref
          # (path .ci-op-e2e-tests): that pin tracks C2_BLESSED, a DIFFERENT axis
          # (check-ci-pins.sh Axis 3 vs 4). Without the path filter the weekly job
          # files a false t8n STALE issue whose remediation text would repoint the
          # C2 checkout at the t8n branch and break the C2 pipeline. The filter parses
          # the whole checkout block: `grep -v ci-op-e2e-tests` alone only removed the
          # path: line while the ref: line survived into t8n_pins (the leak the comment
          # above claims to prevent).
          t8n_pins=$( { grep -hoE 'opstack-t8n-regen@[0-9a-f]{40}' $WF_T8N | sed 's/.*@//'; \
                        sed 's/#.*//' $WF_T8N | awk '
                            function flush() {
                                if (repo && path != "" && path !~ /ci-op-e2e-tests/ && ref != "")
                                    print ref
                                repo = 0; ref = ""; path = ""
                            }
                            /^[[:space:]]*-[[:space:]]*(name|uses|run):/ { flush() }
                            /repository:[[:space:]]*FISCO-BCOS\/op-stack-e2e-tests/ { repo = 1 }
                            match($0, /ref:[[:space:]]*[0-9a-zA-Z._\/-]+/) {
                                ref = substr($0, RSTART, RLENGTH); sub(/^ref:[[:space:]]*/, "", ref)
                            }
                            match($0, /path:[[:space:]]*[0-9a-zA-Z._\/-]+/) {
                                path = substr($0, RSTART, RLENGTH); sub(/^path:[[:space:]]*/, "", path)
                            }
                            END { flush() }
                        '; } | sort -u)
          c2_pin=$(grep -hoE 'ref: [0-9a-f]{40}' .github/workflows/c2-e2e.yml \
            | awk '{print $2}' | sort -u)
          # Each distinct t8n pin is checked against the blessed pipeline head.
          for pin in $t8n_pins; do
            check_class "t8n-corpus" "$pin" "$T8N_BLESSED"
          done
          for pin in $c2_pin; do
            check_class "c2-harness" "$pin" "$C2_BLESSED"
          done
          if [ -n "$stale_json" ]; then
            echo "STALE_PINS=[${stale_json%,}]" >> "$GITHUB_ENV"
            echo "HAS_STALE=1" >> "$GITHUB_ENV"
          fi

      - name: Open a reminder issue naming every stale spot
        if: env.HAS_STALE == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_PINS: ${{ env.STALE_PINS }}
        run: |
          set -euo pipefail
          # De-duplicate: one open tracker at a time — re-arm the existing issue with
          # the current state instead of opening a fresh one every Monday.
          existing=$(gh issue list --state open --limit 50 \
            --search '"harness pin stale" in:title' --json number,title \
            --jq '.[] | select(.title == "harness pin stale: op-stack-e2e-tests blessed heads moved") | .number' \
            | head -n1)
          if [ -n "$existing" ]; then
            echo "open issue #$existing already tracks stale pins — commenting, not duplicating"
            gh issue comment "$existing" \
              --body "Still stale ($(date -u +%F) run): \`STALE_PINS=$STALE_PINS\`"
            exit 0
          fi
          gh issue create \
            --title "harness pin stale: op-stack-e2e-tests blessed heads moved" \
            --body "The pinned op-stack-e2e-tests revisions no longer match their blessed heads.

          \`STALE_PINS=$STALE_PINS\`

          Bump the \`ref:\` lines in the named workflow files to the blessed head (policy:
          stable commits, bumped manually — see harness-pin-freshness.yml). If a harness
          change requires a FISCO-side engine change, land that first, then bump." \
            --label "ci" || \
          echo "issue creation failed (label may be missing) — the staleness above is still recorded in this run's log"

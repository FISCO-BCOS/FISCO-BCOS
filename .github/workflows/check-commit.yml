name: Commit Check
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  release:
    types: [published, created, edited]

jobs:
  build:
    name: check commit
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 50

      - name: Check
        run: |
          python3 -m pip install --user "clang-format==$(cat tools/.ci/clang-format-version)"
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/.ci/check-commit.sh
          bash tools/.ci/check_log_events.sh

name: Build and Publish Binary
on:
  push:
    tags-ignore:
      - v1.*
    branches-ignore:
      - "**"
  release:
    types: [published, created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build_type }} binary of ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            macos-15-intel,
          ]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
            !${{ github.workspace }}/vcpkg/.git
            !${{ github.workspace }}/vcpkg/buildtrees
            !${{ github.workspace }}/vcpkg/packages
            !${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ hashFiles( 'vcpkg.json' ) }}-${{ hashFiles( 'vcpkg-configuration.json' ) }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v1
      - name: Free disk space
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Install linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos-')
        run: brew install libomp autoconf automake libtool
      - name: install rust language
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Set packaging variables
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-24.04)
              PKG_OS=linux
              PKG_ARCH=x86_64
              TRIPLET=x64-linux-release
              ;;
            ubuntu-24.04-arm)
              PKG_OS=linux
              PKG_ARCH=aarch64
              TRIPLET=arm64-linux-release
              ;;
            macos-15)
              PKG_OS=macOS
              PKG_ARCH=arm
              TRIPLET=arm64-osx-release
              ;;
            macos-15-intel)
              PKG_OS=macOS
              PKG_ARCH=x86_64
              TRIPLET=x64-osx-release
              ;;
          esac
          if [[ "${{ matrix.build_type }}" == "Debug" ]]; then
            PKG_NAME="fisco-bcos-${PKG_OS}-${PKG_ARCH}-debug.tar.gz"
          else
            PKG_NAME="fisco-bcos-${PKG_OS}-${PKG_ARCH}.tar.gz"
          fi
          echo "TRIPLET=$TRIPLET" >> "$GITHUB_ENV"
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
      - name: Configure for linux
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_STATIC=ON -DLINKER=mold -DTESTS=OFF -DWITH_LIGHTNODE=OFF -DWITH_CPPSDK=OFF -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOLS=OFF -DVCPKG_TARGET_TRIPLET=${TRIPLET} ..
      - name: Configure for macOS
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew unlink cmake 2>/dev/null || true
          cmake --version
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build
          cd build
          CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_STATIC=ON -DTESTS=OFF -DWITH_LIGHTNODE=OFF -DWITH_CPPSDK=OFF -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOLS=OFF -DVCPKG_TARGET_TRIPLET=${TRIPLET} ..
      - name: Build
        run: |
          cd build
          cmake --build . --target fisco-bcos
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR=build/fisco-bcos-air
          if [[ ! -f "$BIN_DIR/fisco-bcos" ]]; then
            echo "Binary not found at $BIN_DIR/fisco-bcos" >&2
            ls -la build || true
            exit 1
          fi
          if [[ "${{ matrix.build_type }}" == "Release" ]]; then
            strip "$BIN_DIR/fisco-bcos"
            tar -C "$BIN_DIR" -czf "${PKG_NAME}" fisco-bcos
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            # macOS keeps DWARF in the object files: without a dSYM bundle the
            # published Debug binary would carry no usable debug info.
            dsymutil "$BIN_DIR/fisco-bcos" -o "$BIN_DIR/fisco-bcos.dSYM"
            tar -C "$BIN_DIR" -czf "${PKG_NAME}" fisco-bcos fisco-bcos.dSYM
          else
            tar -C "$BIN_DIR" -czf "${PKG_NAME}" fisco-bcos
          fi
          ls -lh "${PKG_NAME}"
      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG_NAME }}

  upload_build_chain:
    name: upload build_chain.sh
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload build_chain.sh to release
        uses: softprops/action-gh-release@v2
        with:
          files: tools/BcosAirBuilder/build_chain.sh

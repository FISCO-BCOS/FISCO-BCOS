name: opstack-fork-weekly
on:
  schedule:
    - cron: "0 4 * * 0"   # 04:00 UTC, Sundays
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fork-matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v4
      - name: Checkout op-stack-e2e-tests assets (the composite action reads its regen.sh
        # through the caller's workspace -- F-CI-2 untracked the in-tree symlink, so the
        # corpus must be checked out and linked here, exactly as workflow.yml does)
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          ref: 7cd99b8ffd6b741c5b707b56573e5c868c29a340
          path: e2e-tests
      - name: Symlink the t8n corpus into in-tree paths
        run: ln -s "$GITHUB_WORKSPACE/e2e-tests/opstack-executor/tests/t8n" "$GITHUB_WORKSPACE/opstack-executor/tests/t8n"
      - name: Regenerate opstack t8n vectors (corpus + goldens + getpayload envelopes)
        uses: FISCO-BCOS/op-stack-e2e-tests/.github/actions/opstack-t8n-regen@7cd99b8ffd6b741c5b707b56573e5c868c29a340
      - name: Install toolchain (matches the coverage job's recipe)
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - name: Configure + build the test binaries (suites + every mutation-harness target)
        run: |
          mkdir -p build && cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold \
            -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF \
            -DWITH_TARS_SERVICES=OFF -DTOOLS=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
          cmake --build . --target test-bcos-engine opstack-executor-block-tests \
            opstack-executor-tests bcos-evm-opstack-tests test-bcos-ledger -j 4
      - name: C++ fork suites (one invocation per suite; Boost rejects comma lists)
        run: |
          set -euo pipefail
          check_suite() {  # <binary> <suite>
            local out_file
            out_file=$(mktemp)
            "$1" --run_test="$2" --log_level=test_suite >"$out_file" 2>&1 || true
            cat "$out_file"
            grep -qE 'Running [1-9][0-9]* test cases?' "$out_file" \
              || { echo "SUITE DID NOT RUN: $2 on $1"; rm -f "$out_file"; exit 1; }
            grep -q '\*\*\* No errors detected' "$out_file" \
              || { echo "SUITE FAILED: $2 on $1"; rm -f "$out_file"; exit 1; }
            rm -f "$out_file"
          }
          check_suite ./build/engine/test/test-bcos-engine OpEnginePayloadShapeBaselineSuite
          check_suite ./build/engine/test/test-bcos-engine OpForkBoundarySweepSuite
          check_suite ./build/engine/test/test-bcos-engine OpHeaderFieldSetBaselineSuite
          check_suite ./build/opstack-executor/tests/opstack-executor-block-tests OpGoldenCorpusProvenance
          check_suite ./build/bcos-evm/test/bcos-evm-opstack-tests OpPrecompilesSuite
          check_suite ./build/bcos-evm/test/bcos-evm-opstack-tests OpOsakaSemanticsSuite
      - name: Set up Python 3.11 (mapping.json reader for the mutation harness)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Mutation harness (full variant set; restores source, leaves mutant BINARIES — runner is ephemeral)
        run: bash tools/mutation/run.sh
      - name: conformance status placeholder (Plan D not started)
        # Block scalar: the value's inner "execution: ..." colon-space is not valid
        # inside a YAML plain scalar (the plan snippet's one syntax bug).
        run: |
          echo "conformance differential execution: pending Plan D; tracked in docs/plans"
      - name: route failure to an issue, do not block PRs
        if: failure()
        run: |
          gh label create test-matrix --color D93F0B --force || true
          gh issue create --label test-matrix \
            --title "weekly fork matrix failed: ${{ github.run_id }}" \
            --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: C2 OP e2e (manual + nightly full run)
# Per-PR coverage comes from workflow.yml → c2_e2e, which runs the FULL
# adversarial + kona depth (CONTEST=1, KONA_VERIFY=1) reusing the build job's
# fisco-bcos artifact. This workflow is the full run — it builds fisco-bcos
# from scratch — and is triggered manually or nightly.
on:
  workflow_dispatch:
    inputs:
      contest:
        description: "Run adversarial dispute scenarios (1=yes, 0=skip dispute scenarios)"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]
  # Nightly full run: CONTEST=1 (adversarial dispute scenarios + kona native replay).
  # The per-PR leg in workflow.yml runs the same CONTEST=1 + kona depth.
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STEP-SET TWIN of workflow.yml's c2_e2e job (that one downloads the build
  # job's fisco-bcos artifact; this one builds from source): every shared step
  # must be edited in lockstep in both files.
  c2_e2e:
    name: C2 deposit/withdraw e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Manual runs pass the input; a scheduled run has none, so default to the full
      # adversarial variant there.
      CONTEST: ${{ github.event.inputs.contest || '1' }}
      # Same sizing as workflow.yml's build matrix: 300M is two or three revisions of
      # headroom above the ~103MB working set. The build matrix's prune step keeps its
      # prefix at one live generation; without it the 7-day retention would hold ~7.
      # See workflow.yml's build-matrix env comment for the full model.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_ctime
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # The e2e harness lives in its own repo; pinned ref — bump it in lockstep
      # with node changes (its CI gates the harness itself).
      - name: Check out the op-e2e harness (op-stack-e2e-tests)
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          # FISCO-BCOS/op-stack-e2e-tests#13 moves the harness to the 3.18 config surface
          # ([engine_rpc], no [op_fork_schedule], separate config.ini / config.genesis, no
          # SystemConfig feature_flags slot). This is that PR's head commit, reachable through
          # refs/pull/13/head; re-pin to its merge commit on the default branch once it merges.
          # It descends from the previous pin 5a2ad071a, so it keeps the kona native replay
          # phase 3.6 and setup_c2.sh's [web3_rpc] enable_debug_api=true (kona-host's preimage
          # oracle).
          ref: dac984d09777de634279025b6f6013106ae42b5c
          path: .ci-op-e2e-tests

      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg

      - name: Compute vcpkg revision
        id: vcpkg-revision
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-cache-key-v4

      - name: Compute ccache bucket
        id: ccache-bucket
        shell: bash
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # Restores the build matrix's prefix (the l2 leg that used to own a
          # separate ccache-l2-* scope was removed: WITH_L2_CONTRACTS=ON never
          # changed a compile line, so its objects were identical to the plain
          # ubuntu-26.04 leg's). This job is restore-only: it builds just
          # --target fisco-bcos, a strict subset of what the build leg builds,
          # and actions/cache/save locks a daily key to its first writer - a
          # nightly save here could seed the shared prefix with the subset and
          # starve the build leg's full refresh for that day.
          key: ccache-${{ github.ref_name }}-ubuntu-26.04-${{ runner.arch }}-v1-${{ steps.ccache-bucket.outputs.day }}
          restore-keys: |
            ccache-${{ github.ref_name }}-ubuntu-26.04-${{ runner.arch }}-v1-

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            wget python3-dev python3-pip git curl ca-certificates lld \
            build-essential libssl-dev zlib1g-dev gcc-16 g++-16 jq zip ccache
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Foundry (optimism contracts-bedrock pin)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          # No cache-dependency-path: this repository has no go.mod/go.sum, so setup-go's cache
          # restore failed with "Some specified paths were not resolved" on every run. The Go
          # code lives in the OP monorepo, which is cloned LATER in the same job (see Build OP
          # stack binaries) and is keyed by its own commit; the artifact cache below covers the
          # binaries, so a module cache here would buy nothing and its key would be a fiction.
          cache: false

      - name: Install just (op-deployer build)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
          just --version

      # kona-host / kona-client (rust/kona) are built with cargo for the native replay
      # verification leg. KONA_VERIFY follows CONTEST unless set explicitly, so a dispatch with
      # contest=0 runs the smoke leg and skips the replay (and its [kona-verify] PASS guard).
      - name: Set up Rust (kona build)
        uses: dtolnay/rust-toolchain@stable

      - name: Read OP monorepo pin
        id: op-pin
        run: |
          set -euo pipefail
          COMMIT=$(python3 -c "import json; print(json.load(open('.ci-op-e2e-tests/tools/op-e2e/versions.json'))['op_monorepo']['commit'])")
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Cache OP binaries
        id: op-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-op-monorepo
            .ci-c2-bins
          # BOTH paths are required. .ci-c2-bins carries the binaries, but .ci-op-monorepo must
          # stay in the entry even though the e2e itself only consumes the binaries: setup_c2.sh
          # ends with a versions.json check that ENFORCES op_monorepo.commit (`git -C $MONOREPO
          # rev-parse HEAD`), and c2-e2e.sh passes MONOREPO=$REPO_ROOT/.ci-op-monorepo. On a cache
          # hit the Build step is skipped, so an entry without the clone makes that check read ""
          # and the e2e aborts with "version manifest mismatch" - far from the cause. Do not
          # narrow this to .ci-c2-bins alone.
          # The -kona1- token describes the cached binary SET: this entry now also carries
          # kona-host/kona-client (cargo build). A cache keyed only on the OP monorepo commit
          # would hit a pre-kona entry (op-deployer/op-node/op-batcher only) and skip the
          # kona build, failing the e2e step with "missing .../kona-host". Bump the token
          # whenever the cached binary set changes (e.g. the future cannon/MIPS leg).
          key: c2-op-${{ steps.op-pin.outputs.commit }}-kona1-${{ runner.os }}-${{ runner.arch }}

      - name: Build OP stack binaries
        if: steps.op-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-c2-bins
          if [ ! -d .ci-op-monorepo/.git ]; then
            git clone --filter=blob:none https://github.com/ethereum-optimism/optimism .ci-op-monorepo
          fi
          git -C .ci-op-monorepo fetch --depth=1 origin "${{ steps.op-pin.outputs.commit }}" \
            || git -C .ci-op-monorepo fetch origin
          git -C .ci-op-monorepo checkout -q "${{ steps.op-pin.outputs.commit }}"
          git -C .ci-op-monorepo submodule update --init superchain-registry
          bash .ci-op-monorepo/op-core/superchain/sync-superchain.sh
          # Plain go build omits artifacts.tzst; op-deployer apply fails without just build.
          # Same step as tools/.ci/c2-e2e.sh, with one deliberate difference: this job builds the
          # binaries itself, so the e2e step runs with SKIP_OP_BUILD=1 and the script's
          # ensure_op_forge never executes. Keep its assertion by hand — a forge other than the
          # monorepo's mise.toml pin fails forge-lint inside the build, far from the cause.
          MISE_FORGE=$(yq -r '.tools.forge' .ci-op-monorepo/mise.toml 2>/dev/null || true)
          if [ -n "${MISE_FORGE}" ] && [ "${MISE_FORGE}" != "null" ]; then
            forge --version | grep -q "${MISE_FORGE}" || {
              echo "ERROR: forge $(forge --version) is not the mise.toml pin ${MISE_FORGE}"; exit 1; }
          fi
          (cd .ci-op-monorepo/op-deployer && just build)
          cp .ci-op-monorepo/op-deployer/bin/op-deployer "$GITHUB_WORKSPACE/.ci-c2-bins/op-deployer"
          (cd .ci-op-monorepo && go build -o "$GITHUB_WORKSPACE/.ci-c2-bins/op-batcher" ./op-batcher/cmd)
          (cd .ci-op-monorepo && go build -o "$GITHUB_WORKSPACE/.ci-c2-bins/op-node" ./op-node/cmd)
          (cd .ci-op-monorepo/rust && cargo build --release -p kona-host -p kona-client)
          cp .ci-op-monorepo/rust/target/release/kona-host "$GITHUB_WORKSPACE/.ci-c2-bins/kona-host"
          cp .ci-op-monorepo/rust/target/release/kona-client "$GITHUB_WORKSPACE/.ci-c2-bins/kona-client"
          # The cache entry carries .ci-op-monorepo but must not carry its build products:
          # actions/cache's ! path exclusions do not subtract a directory's recursive
          # contents (@actions/glob, implicitDescendants:false), so delete them here instead.
          rm -rf .ci-op-monorepo/rust/target .ci-op-monorepo/op-deployer/bin
      - name: Save OP binaries
        # cache-hit != 'true' skips the save when the entry already exists (pin unchanged).
        # The path set and key MUST mirror the Cache OP binaries restore above exactly (both
        # paths, -kona1- token): a mismatch means the -kona1- entry is never created and the
        # restore misses forever.
        if: steps.op-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-op-monorepo
            .ci-c2-bins
          key: c2-op-${{ steps.op-pin.outputs.commit }}-kona1-${{ runner.os }}-${{ runner.arch }}

      - name: Configure FISCO
        # No WITH_L2_CONTRACTS=ON: it only wires forge custom targets that are
        # not part of the default build (the "Forge build L2 contracts" step
        # below is the real coverage), so the flag would change nothing here.
        run: |
          mkdir -p build
          cd build
          CC=gcc-16 CXX=g++-16 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=lld \
            -DTESTS=ON -DCOVERAGE=OFF \
            -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON \
            -DWITH_TARS_SERVICES=OFF -DTOOL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release ..

      # vcpkg installs during Configure; nothing past this point writes to
      # build/vcpkg_installed, so save right here instead of behind the 45-minute e2e -
      # an e2e flake after a dependency change would otherwise discard the freshly built
      # tree. This workflow has no pull_request trigger (manual + nightly only), so its
      # saves are always legitimate refreshes, not PR churn.
      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-cache-key-v4

      - name: Build fisco-bcos
        run: cmake --build build --target fisco-bcos

      - name: ccache stats
        # always(): the hit rate and cache size are the evidence for the cap sizing, and a
        # failed or timed-out build is exactly the run whose numbers are wanted.
        if: always()
        run: ccache --show-stats

      - name: Fetch pinned Solidity deps
        run: bash tools/.ci/fetch-l2-contract-deps.sh

      - name: Forge build L2 contracts
        run: forge build
        working-directory: bcos-l2-contracts

      - name: Run C2 ephemeral e2e
        run: SKIP_OP_BUILD=1 SKIP_KONA_BUILD=1 bash tools/.ci/c2-e2e.sh
        env:
          REPO_ROOT: ${{ github.workspace }}
          BIN_DIR: ${{ github.workspace }}/.ci-c2-bins
          FISCO_BIN: ${{ github.workspace }}/build/fisco-bcos-air/fisco-bcos
          SKIP_FISCO_BUILD: "1"

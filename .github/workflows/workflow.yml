name: Github runner
on:
  push:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write
    env:
      # ccache lives under the workspace so actions/cache can persist it.
      # Sized from measurement: compiling all 325 translation units of this project with
      # the CI's MinSizeRel flags fills 103 MB of ccache (~0.32 MB per TU, ~115 MB for the
      # ~360 TUs a leg builds). So the 200M the legs used to carry already held about two
      # revisions' worth; the reason runs were cold is not the cap but that the entries do
      # not survive - see the Save step for how the write rate is bounded.
      # 300M is two or three revisions of headroom above the ~115MB working set. The daily
      # bucket (see Restore ccache) bounds writes to one per scope per day, and the prune
      # step after the save deletes the previous generations, so the steady state is one
      # live generation per scope plus the one being written - not the ~7 that GitHub's
      # 7-day retention would otherwise keep. LRU is only the backstop now: if a prune is
      # skipped or fails, stale generations go cold and are evicted before the vcpkg trees,
      # which are restored - and so recently accessed - on every run.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
      # ccache mixes the absolute working directory into its hash, and a fresh checkout
      # re-stamps every mtime; both differ between runs even when sources are identical.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_ctime
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "1"
      # One cache per matrix entry: compile flags differ per leg (e.g. the
      # windows leg is TESTS=OFF), and a flag change alters every translation
      # unit's command line and therefore its ccache hash, so sharing one scope
      # would be all misses.
      # Named CACHE_SCOPE rather than CCACHE_*: ccache reads its configuration from
      # CCACHE_-prefixed environment variables, and this is a cache-key component for
      # actions/cache, not a ccache option.
      CACHE_SCOPE: ${{ matrix.os }}
      # vcpkg binary caching. vcpkg already enables a "files" provider by default, but it
      # points at an ephemeral per-run location ($HOME/.cache/vcpkg/archives,
      # %LOCALAPPDATA%\vcpkg\archives), so nothing survives to the next run - the configure
      # log says "Restored 0 package(s)". Redirecting it into the workspace lets
      # actions/cache persist the archives across runs.
      #
      # Why this matters more than it looks: a vcpkg archive is keyed by the package ABI hash,
      # and that hash folds in the *compiler executable* (see the triplet_abi entry in vcpkg's
      # own ABI debug output). A hosted runner image that ships a new MSVC/GCC therefore moves
      # every package's ABI at once, and restoring the whole build/vcpkg_installed tree then
      # invalidates all of it - the Windows leg reported an actions/cache hit yet rebuilt 100
      # packages in 58 minutes. Per-package archives fail independently, so only the packages
      # whose ABI actually moved get rebuilt.
      #
      # clear;files,<dir>,readwrite drops vcpkg's default files provider (the ephemeral per-run
      # location named above) and replaces it with the workspace location.
      # PR runs keep readwrite here on purpose: they never run the Save step below, so the
      # archives they build are simply discarded with the runner instead of being published.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
          ]
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-cache-key-v4
      # Per-package vcpkg archives (see VCPKG_BINARY_SOURCES above). Restoring never writes on its
      # own; the "Save vcpkg archives" step below publishes them for master/release-* non-PR runs
      # only, so a PR or a feature-branch push just warms from whatever a base-branch push left
      # behind.
      # The key is scoped per build leg (CACHE_SCOPE = matrix.os) because the legs do not install
      # the same packages: TESTS appends the tests vcpkg manifest feature and the windows leg
      # configures TESTS=OFF, so an unscoped key would let whichever leg saves first publish an
      # archive set that is missing packages the other legs then have to rebuild from source.
      # The bucket is the UTC date, like the ccache key below: actions/cache entries are
      # immutable, so a fixed key would freeze the archives at their first upload, while a fresh
      # run_id key would write one entry per run per leg and put LRU pressure on the repository's
      # 10GB cache budget. One entry per scope per day, warming from the previous day via
      # restore-keys; archives are content-addressed by ABI hash, so a stale or missing one only
      # costs that single package rather than the whole tree.
      - name: Compute archives bucket
        id: archives-bucket
        shell: bash
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        id: vcpkg-archives
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-archives-${{ env.CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.archives-bucket.outputs.day }}
          restore-keys: |
            vcpkg-archives-${{ env.CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-v1-
      # ccache persists the compiler output keyed on source+flags content (not mtime), so a
      # warm cache reuses .o across runs and only recompiles the files that actually changed.
      # The key is compiler/OS/arch-scoped (a .o is not portable across those) and deliberately
      # does NOT bind the source tree: ccache already misses on any content change.
      # The bucket is the UTC date: a base-branch push writes at most one entry per scope per
      # day (save is skipped when the key already exists), instead of a fresh immutable entry
      # per run per leg. That write rate is what fills the repository's 10GB budget and evicts
      # the far costlier vcpkg trees; restore-keys' prefix picks up the newest entry whatever
      # its bucket, so a run still warms from the previous day's cache.
      - name: Compute ccache bucket
        id: ccache-bucket
        if: matrix.os != 'windows-2025'
        shell: bash
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore ccache
        id: ccache
        if: matrix.os != 'windows-2025'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # The prefix is also scoped by branch: a push writes under its own branch name and a
          # PR reads under its base branch (github.base_ref), so a master push and a
          # release-3.18.0 PR stop sharing one baseline. ccache hashes content and flags, so
          # an entry from the "wrong" branch could only ever be a miss, never a bad object.
          # A release event has no base_ref and its ref_name is the tag: fall back to the
          # master prefix so the tagged build (BUILD_STATIC=ON but compile-line identical,
          # per the 79/79 compile-commands diff) still warms from master's entries. Saves
          # stay gated on master/release-* below, so a tag never writes.
          key: ccache-${{ github.base_ref || (startsWith(github.ref, 'refs/tags/') && 'master' || github.ref_name) }}-${{ env.CACHE_SCOPE }}-${{ runner.arch }}-v1-${{ steps.ccache-bucket.outputs.day }}
          restore-keys: |
            ccache-${{ github.base_ref || (startsWith(github.ref, 'refs/tags/') && 'master' || github.ref_name) }}-${{ env.CACHE_SCOPE }}-${{ runner.arch }}-v1-
      - name: Set up Node.js 20
        if: matrix.os != 'windows-2025'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-26.04' || matrix.os == 'ubuntu-26.04-arm'
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates lld autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-16 g++-16 ccache
      - name: Install macOS dependencies
        if: matrix.os == 'macos-26'
        run: brew install libomp autoconf automake libtool ccache
      - name: Set up MSVC environment
        # The windows-2025 image ships Visual Studio 18 (2026), which the pinned
        # CMake 3.28 cannot recognize as a generator: generator auto-detection
        # falls back to "NMake Makefiles" and fails with "'nmake' '-?' failed"
        # because nothing put the VC tools on PATH. Use the Ninja generator with
        # cl.exe from the developer environment instead (version-agnostic).
        if: matrix.os == 'windows-2025'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions-rs/toolchain@v1
        if: matrix.os != 'windows-2025'
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Compute build flags
        if: matrix.os != 'windows-2025'
        shell: bash
        run: |
          # Release events build the shipped binaries statically (the release
          # assets are the fully-static tarballs).
          EXTRA_FLAGS=""
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            EXTRA_FLAGS="-DBUILD_STATIC=ON"
          fi
          # The hive gate job (hive_smoke) reuses this leg's artifact and also
          # needs eth-sync-check (genesis2ini); tools are off by default.
          if [[ "${{ matrix.os }}" == "ubuntu-26.04" ]]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} -DTOOLS=ON"
          fi
          echo "EXTRA_FLAGS=${EXTRA_FLAGS}" >> "$GITHUB_ENV"
      - name: Configure for linux
        if: matrix.os == 'ubuntu-26.04'
        run: |
          mkdir -p build
          cd build
          CC=gcc-16 CXX=g++-16 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=lld -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVCPKG_TARGET_TRIPLET=x64-linux-release ${EXTRA_FLAGS} ..
      - name: Configure for linux arm
        if: matrix.os == 'ubuntu-26.04-arm'
        run: |
          mkdir -p build
          cd build
          CC=gcc-16 CXX=g++-16 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=lld -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVCPKG_TARGET_TRIPLET=arm64-linux-release ${EXTRA_FLAGS} ..
      - name: Configure for macOS
        if: matrix.os == 'macos-26'
        run: |
          brew unlink cmake 2>/dev/null || true
          cmake --version
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build
          cd build
          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVCPKG_TARGET_TRIPLET=${ARCH}-osx-release ${EXTRA_FLAGS} ..
      - name: Configure for windows
        if: matrix.os == 'windows-2025'
        run: |
          mkdir build -Force
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DALLOCATOR=default -DTESTS=OFF -DFULLNODE=OFF -DWITH_LIGHTNODE=OFF -DWITH_TARS_SERVICES=OFF -DWITH_CPPSDK=ON -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static-release ..
      # vcpkg installs during Configure; nothing past this point writes to
      # build/vcpkg_installed, so strip and save the tree right here instead of at the end
      # of the job: a flake in the build, the unit tests or any of the E2E gates would
      # otherwise discard a freshly built dependency tree and the next run would pay a full
      # ~43 minute rebuild. No always(): at this position the implicit success() means
      # "Configure completed", which is exactly when the tree is whole - a failed configure
      # must not save a partial one. cache-hit skips the write when the key already exists.
      - name: Reduce vcpkg cache size
        if: matrix.os != 'windows-2025'
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          du -sh build/vcpkg_installed 2>/dev/null  || true

          # 1) Remove only debug libraries — keep debug metadata/includes intact
          echo "Removing debug libraries..."
          find build/vcpkg_installed -path '*/debug/lib/*' \( -name "*.a" -o -name "*.so" -o -name "*.so.*" -o -name "*.dylib" \) -print -delete 2>/dev/null || true

          # 2) Strip release static libs (remove debug info, keep symbols needed for linking)
          echo "Stripping release static libraries..."
          find build/vcpkg_installed \( -name "*.a" -o -name "*.dylib" \) -print -exec strip -S {} \; 2>/dev/null || true

          # 3) Remove per-package build workdirs if present (already excluded from cache, paranoia)
          rm -rf build/vcpkg_installed/*/src 2>/dev/null || true

          echo "=== After cleanup ==="
          du -sh build/vcpkg_installed 2>/dev/null || true
      # Cache SAVE is deliberately split from restore (actions/cache/restore above) so a PR
      # never writes: only push (merge to the base branch) and release refresh the entries,
      # and a PR's restore falls back to the base branch's most recent entry via the key
      # prefix. Keep this key byte-identical to the Restore step above.
      - name: Save vcpkg cache
        if: github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-cache-key-v4
      # The archives are written by vcpkg during Configure, so this has to sit after it - and it
      # is the step that makes a later ABI bump cheap: whatever this run had to build from source
      # is now an archive, so the next run with a new compiler restores it instead of rebuilding.
      # Master/release-* non-PR runs only: a feature-branch push would write entries no other
      # branch can read while still consuming the shared 10GB cache budget, and the daily bucket
      # already bounds each scope to one entry per day. !cancelled() && !failure() runs the save
      # after a non-fatal earlier-step failure but skips it when the run is cancelled or the
      # configure failed (a failed configure must not publish whatever partial set it left
      # behind); a run superseded by concurrency cancel-in-progress is a cancellation, so it is
      # skipped too. Keep this key byte-identical to the Restore step above.
      - name: Report vcpkg archives size
        if: '!cancelled() && !failure()'
        shell: bash
        run: du -sh "${{ github.workspace }}/.vcpkg-archives" || true
      - name: Save vcpkg archives
        if: '!cancelled() && !failure() && github.event_name != ''pull_request'' && (github.ref_name == ''master'' || startsWith(github.ref_name, ''release-''))'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-archives-${{ env.CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.archives-bucket.outputs.day }}
      - name: Build
        run: |
          cd build
          # Bound the job count: with the repo-wide unity build one translation unit folds up to
          # 8 sources together. The heaviest TUs peaked at ~3.7 GB of compiler RSS when measured
          # with the CI flags at batch 16 (test-bcos-rpc / test-transaction-scheduler); the peak
          # at batch 8 has not been re-measured (follow-up issue), so the cap stays conservative.
          # Leaving --parallel unset lets the generator use every core, so several of those can
          # run at once on a 4 vCPU runner and this step has been dying a runner
          # "lost communication"/SIGTERM instead of a compile error. --parallel 3 keeps the worst
          # case within the 16 GB budget and matches the coverage job, which is the heaviest
          # build in this workflow and the stable one precisely because it already bounds
          # parallelism.
          cmake --build . --parallel 3
      - name: ccache stats
        # always(): the hit rate and cache size are the evidence for the cache sizing, and a
        # failed or timed-out build is exactly the run whose numbers are wanted.
        if: always() && matrix.os != 'windows-2025'
        run: ccache --show-stats
      # Save ccache right after the steps that fill it: nothing later writes to .ccache, and
      # leaving the save at the end of the job put it behind six E2E gates (EEST, RpcApi,
      # air, eth-executor, single-node consensus, Engine API) - any one of them flaking would
      # freeze the baseline cache.
      # !cancelled() on purpose: a FAILED build has usually compiled most of its TUs and its
      # content-addressed cache is still valid, so failure must not block the save; but a
      # CANCELLED run (concurrency's cancel-in-progress supersedes pushes mid-build) must not
      # claim the shared daily key with whatever partial state it held - every later run that
      # day would find the key taken and skip its own save. Only base-branch pushes write: a
      # PR must never write (see the Restore step for the key scoping), and a feature-branch
      # push would write an entry under its own branch-scoped prefix that no PR ever reads
      # while still competing for the repository's 10GB cache budget.
      - name: Save ccache
        if: '!cancelled() && matrix.os != ''windows-2025'' && github.event_name != ''pull_request'' && (github.ref_name == ''master'' || startsWith(github.ref_name, ''release-'')) && steps.ccache.outputs.cache-primary-key != '''''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      # The daily bucket bounds the write RATE, not the number of live entries: with 7-day
      # retention ~7 generations per scope would otherwise pile up. After the save, delete
      # every older generation of this scope's prefix on this ref; restore-keys only ever
      # reads the newest, so the older ones are dead weight. Non-fatal on purpose: a prune
      # failure costs cache budget, not the build, and the next push retries.
      # The prune only deletes after confirming today's entry is in the listing: an
      # actions/cache/save upload failure surfaces as a warning with a successful step
      # outcome, and without that gate a silent save failure would let the prune delete
      # yesterday's generation - the prefix's only entry - and cold-build the next run.
      - name: Prune previous ccache generations
        if: '!cancelled() && matrix.os != ''windows-2025'' && github.event_name != ''pull_request'' && (github.ref_name == ''master'' || startsWith(github.ref_name, ''release-'')) && steps.ccache.outputs.cache-primary-key != '''''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix='ccache-${{ github.base_ref || github.ref_name }}-${{ env.CACHE_SCOPE }}-${{ runner.arch }}-v1-'
          keep="${prefix}${{ steps.ccache-bucket.outputs.day }}"
          if ! listing=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,ref); then
            echo "::warning::gh cache list failed; ccache reclamation deferred to the next push"
            exit 0
          fi
          if ! printf '%s' "$listing" | jq -e --arg keep "$keep" --arg ref "$GITHUB_REF" \
              'any(.[]; .ref == $ref and .key == $keep)' > /dev/null; then
            echo "::warning::today's ccache entry ${keep} is absent; skipping prune"
            exit 0
          fi
          ids=$(printf '%s' "$listing" | jq -r --arg prefix "$prefix" --arg keep "$keep" --arg ref "$GITHUB_REF" \
            '.[] | select(.ref == $ref) | select(.key | startswith($prefix)) | select(.key != $keep) | .id') \
            || { echo "::warning::cache listing parse failed; ccache reclamation deferred to the next push"; exit 0; }
          count=$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "pruning ${count} stale generation(s) under ${prefix} (keeping ${keep})"
          printf '%s\n' "$ids" | sed '/^$/d' | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::ccache generation prune failed; reclamation deferred to the next push"
      - name: Test
        # the windows leg builds with TESTS=OFF
        if: matrix.os != 'windows-2025'
        run: |
          cd build
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3
      - name: Assert the module suites are registered with ctest
        # Moved from the removed l2_unit_suites job: a module suite can be
        # compiled and linked yet never registered with ctest (its directory is
        # added before testing is enabled in the parent scope), so it runs
        # nowhere; this step turns that silence into a failure.
        if: matrix.os != 'windows-2025'
        run: |
          cd build
          for suite in MultiVersionSchedulerTest; do
            ctest -N -R "${suite}" | grep -qE "Total Tests: [1-9]" || {
              echo "ERROR: ${suite} is built but not registered with ctest"; exit 1; }
          done
      - name: Download EEST fixtures
        if: matrix.os != 'windows-2025'
        run: |
          cd ${{ github.workspace }}
          # --fail: a 404 would otherwise write the error page into the tarball
          # and surface as a confusing tar error; --retry handles release hiccups.
          curl --fail --retry 3 -L -o fixtures_stable.tar.gz https://github.com/ethereum/execution-spec-tests/releases/download/v5.4.0/fixtures_stable.tar.gz
          tar -xzf fixtures_stable.tar.gz
          # The tarball may extract to fixtures_stable/; ensure we have fixtures/
          if [ -d fixtures_stable ] && [ ! -d fixtures ]; then
            mv fixtures_stable fixtures
          fi
      - name: Run EEST fixture tests
        # the eest-runner is a test target; the windows leg builds with TESTS=OFF
        if: matrix.os != 'windows-2025'
        run: |
          # pipefail so a runner crash (not just a low pass rate) fails the job.
          set -o pipefail
          cd build/ethereum-executor/tests
          ./eest-runner --fixture-dir ../../../fixtures/ --no-log 2>&1 | tee eest_output.txt
          PASS_RATE=$(sed -nE 's/.*Pass rate:[[:space:]]+([0-9]+)%.*/\1/p' eest_output.txt)
          echo "EEST pass rate: ${PASS_RATE}%"
          if [ -z "${PASS_RATE}" ] || [ "${PASS_RATE}" -lt 100 ]; then
            echo "::error::EEST pass rate ${PASS_RATE:-unknown}% is below 100% threshold"
            exit 1
          fi
          echo "::notice::EEST pass rate ${PASS_RATE}% meets the 100% threshold"
      - name: Upload fisco-bcos binary artifact
        if: matrix.os == 'ubuntu-26.04'
        uses: actions/upload-artifact@v4
        with:
          name: fisco-bcos-ubuntu-26-x86_64
          # eth-sync-check rides along for the hive_smoke job (genesis2ini in
          # the hive client entrypoint); upload-artifact keeps the paths
          # relative to their least common ancestor (build/). The fisco-bcos
          # binary is also consumed by the c2_e2e job below.
          path: |
            build/fisco-bcos-air/fisco-bcos
            build/tools/eth-sync-check/eth-sync-check
          retention-days: 30
      # - name: Upload coverage report
      #   if: matrix.os == 'ubuntu-26.04'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-report
      #     path: build/coverage.info
      - name: prepare RPCAPI Tests
        if: matrix.os != 'windows-2025'
        run: |
          cd tools
          bash .ci/rpcapi_ci_prepare.sh
      - name: FISCO BCOS RpcApiTest
        if: matrix.os != 'windows-2025'
        uses: matt-ball/newman-action@v1.0.4
        with:
          collection: https://raw.githubusercontent.com/FISCO-BCOS/FISCOBCOS-RPC-API/main/fiscobcos.rpcapi.collection.json
      - name: Integration test - Air
        if: matrix.os == 'ubuntu-26.04' || matrix.os == 'ubuntu-26.04-arm'
        run: |
          cd tools
          bash .ci/ci_check_air.sh "true"
      - name: Ethereum executor integration test (executor_version=2)
        # Runs a single-node L2 chain with executor_version=2 (ethereum-executor),
        # pre-funds an EOA via genesis alloc, and drives a simple value transfer
        # reused from an EEST fixture through eth_sendRawTransaction /
        # eth_getTransactionReceipt / eth_getBalance. Requires the EEST fixtures
        # downloaded by the "Download EEST fixtures" step above. Linux only:
        # the node fails to bring up the RPC server on the macOS runners (the
        # harness discards the node's stderr, so the root cause is not yet
        # diagnosed; see the air test which likewise excludes macos-26). macOS
        # is excluded until the node startup issue is fixed.
        if: matrix.os == 'ubuntu-26.04' || matrix.os == 'ubuntu-26.04-arm'
        run: |
          # eth-account (tx signing) + requests (RPC). Handle PEP 668.
          python3 -m pip install --quiet eth-account requests 2>/dev/null || \
          pip3 install --quiet eth-account requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet eth-account requests 2>/dev/null || true
          bash tools/.ci/ci_check_eth_executor.sh
      - name: Single-node consensus mode integration test
        # Built-in single-node driver (hidden config.ini [debug] enable): builds a
        # single-node AIR chain, patches config.ini to enable it (no pbft/sealer/txpool),
        # and drives eth_sendRawTransaction -> receipt / block reads.
        if: matrix.os == 'ubuntu-26.04'
        run: |
          # eth-account (tx signing) + requests (RPC). Handle PEP 668.
          python3 -m pip install --quiet eth-account requests 2>/dev/null || \
          pip3 install --quiet eth-account requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet eth-account requests 2>/dev/null || true
          bash tools/.ci/ci_check_single_node_consensus.sh
      - name: Engine API integration test
        if: matrix.os != 'windows-2025'
        run: |
          # Install Python dependencies (handle macOS PEP 668 externally-managed-environment)
          python3 -m pip install --quiet requests 2>/dev/null || \
          pip3 install --quiet requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet requests 2>/dev/null || true
          # Run engine API integration test (curl smoke + Python mock CL)
          bash tools/engine_integration_test.sh build 8551
      - name: Set packaging variables
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        id: pkgvars
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-26.04)
              PKG_OS=linux
              PKG_ARCH=x86_64
              ;;
            ubuntu-26.04-arm)
              PKG_OS=linux
              PKG_ARCH=aarch64
              ;;
            macos-26)
              PKG_OS=macOS
              PKG_ARCH=arm
              ;;
            *)
              PKG_OS=unknown
              PKG_ARCH=unknown
              ;;
          esac
          echo "PKG_OS=$PKG_OS" >> $GITHUB_ENV
          echo "PKG_ARCH=$PKG_ARCH" >> $GITHUB_ENV
          PKG_NAME="fisco-bcos-${PKG_OS}-${PKG_ARCH}.tar.gz"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          # also expose as step outputs for later reference
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
      - name: Create release tarball
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="build/fisco-bcos-air/fisco-bcos"
          if [[ ! -f "$BIN_PATH" ]]; then
            echo "Binary not found at $BIN_PATH" >&2
            ls -la build || true
            exit 1
          fi
          # Create tar.gz in repo root with only the binary inside (no extra folders)
          tar -C "$(dirname "$BIN_PATH")" -czf "${PKG_NAME}" "$(basename "$BIN_PATH")"
      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkgvars.outputs.pkg_name }}

  pro_build:
    # Compile-only gate for the Pro (tars-service) binaries. Every other leg configures
    # WITH_TARS_SERVICES=OFF, which is how #5625 moving SchedulerService/ into legacy/
    # left NodeServiceApp.cpp including a header that no longer existed and nobody saw
    # BcosNodeService fail to link until a Pro chain was built by hand. The option adds
    # no vcpkg manifest feature, so this job reads the ubuntu-26.04 build leg's dependency
    # tree and archives (restore only, it never saves) and compiles the three service
    # targets; nothing is run.
    name: Build Pro services
    runs-on: ubuntu-26.04
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      # Same key as the ubuntu-26.04 entry of the Build job's Restore vcpkg cache step, so
      # this leg warms from the tree that leg saved. Keep it byte-identical to that key.
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-cache-key-v4
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-archives-ubuntu-26.04-${{ runner.os }}-${{ runner.arch }}-v1-never-matches
          restore-keys: |
            vcpkg-archives-ubuntu-26.04-${{ runner.os }}-${{ runner.arch }}-v1-
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates lld autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-16 g++-16
      # TESTS=ON matches the Build leg's manifest features so the restored vcpkg tree is
      # used as-is; the test binaries are not built (only the three targets below are).
      - name: Configure with WITH_TARS_SERVICES=ON
        run: |
          mkdir -p build
          cd build
          CC=gcc-16 CXX=g++-16 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=lld -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=OFF -DWITH_CPPSDK=OFF -DWITH_TARS_SERVICES=ON -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
      - name: Build BcosNodeService BcosRpcService BcosGatewayService
        run: |
          cd build
          cmake --build . --parallel 3 --target BcosNodeService BcosRpcService BcosGatewayService
          ls -l fisco-bcos-tars-service/NodeService/pro/BcosNodeService fisco-bcos-tars-service/RpcService/main/BcosRpcService fisco-bcos-tars-service/GatewayService/main/BcosGatewayService
  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    env:
      # Surfaced as an env var so the upload step can be skipped when no token is
      # present. Fork PRs (pull_request event) receive NO secrets, so a tokenless
      # upload would be rate-limited and orphaned, leaving Codecov stuck at 0.00%
      # ("incomplete uploads on the first attempt"). The token-carrying run is the
      # push event on the base branch (and on a fork that sets the secret).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # --coverage instrumented objects plus -g are several times the size of the
      # MinSizeRel objects the build legs cache, so this job legitimately needs more room
      # than the 300M the other legs use. 2G was more than a working set can use, though:
      # each entry came out ~1.4GB and two of them alone held 2.83GB of the shared 10GB
      # budget, the single largest consumer. The prune step after the save keeps this scope
      # at one live generation plus the one being written; without it the 7-day retention
      # would hold ~7 generations - up to ~7GB at the cap. LRU is the backstop if a prune
      # is skipped or fails - see the build matrix's env comment.
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_ctime
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "1"
      # vcpkg binary caching into the workspace; see the build matrix's env comment for why
      # this matters (the archive key folds in the compiler, so a toolchain bump invalidates
      # the whole vcpkg_installed tree and used to force a ~45 minute rebuild from source).
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          # Only the installed tree, like the build legs. Caching the whole vcpkg checkout as
          # well made this entry 1.58GB instead of ~230MB, and because the old key ignored the
          # vcpkg revision and ports/**, it could be restored after a baseline or custom-port
          # change while the unchanged key kept the save from ever refreshing it. Three live
          # versions of that entry were holding 4.76GB of the repository's 10GB budget, which
          # evicted other legs' vcpkg entries (a miss costs a ~43 minute dependency rebuild).
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-coverage-cache-key-v2
      # Per-package vcpkg archives (VCPKG_BINARY_SOURCES above); the "Save vcpkg archives" step
      # after Configure publishes them for master/release-* non-PR runs. Scoped per job with a
      # daily bucket, same as the build matrix - see the comment there.
      - name: Compute archives bucket
        id: archives-bucket
        shell: bash
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        id: vcpkg-archives
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-archives-coverage-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.archives-bucket.outputs.day }}
          restore-keys: |
            vcpkg-archives-coverage-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Compute ccache bucket
        id: ccache-bucket
        shell: bash
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # Daily bucket + prefix restore, same as the build matrix: at most one entry per
          # day, warming from the previous day's otherwise.
          key: ccache-coverage-ubuntu-26.04-${{ runner.arch }}-v1-${{ steps.ccache-bucket.outputs.day }}
          restore-keys: |
            ccache-coverage-ubuntu-26.04-${{ runner.arch }}-v1-
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates lld autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-16 g++-16 ccache
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure with coverage
        run: |
          mkdir -p build
          cd build
          # -G Ninja like every build leg: without it this job fell back to Unix
          # Makefiles, which is both slower to walk a graph this size and less
          # resilient to being interrupted. This is the longest and heaviest job
          # (RelWithDebInfo -O2 -g + --coverage instrumentation), so the time it
          # spends building is time it is exposed to a runner preemption - a
          # shutdown signal here has already killed it at 89% once.
          # UNITY_BUILD=ON like the build legs: the non-unity pass cost far more
          # build time than its diagnostic value (missing-include detection) is
          # worth here.
          CC=gcc-16 CXX=g++-16 cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLINKER=lld -DTESTS=ON -DCOVERAGE=ON -DUNITY_BUILD=ON -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TARS_SERVICES=OFF -DTOOLS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
      # vcpkg installs during Configure, so save right after it (same reasoning as the
      # build matrix): a later flake must not discard a freshly built dependency tree.
      - name: Save vcpkg cache
        if: github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-coverage-cache-key-v2
      # Gated like the build matrix: master/release-* non-PR runs only, daily bucket. Keep this
      # key byte-identical to the Restore step above.
      - name: Report vcpkg archives size
        if: '!cancelled() && !failure()'
        shell: bash
        run: du -sh "${{ github.workspace }}/.vcpkg-archives" || true
      - name: Save vcpkg archives
        if: '!cancelled() && !failure() && github.event_name != ''pull_request'' && (github.ref_name == ''master'' || startsWith(github.ref_name, ''release-''))'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-archives-coverage-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.archives-bucket.outputs.day }}
      - name: Build
        run: |
          cd build
          cmake --build . --parallel 3
      - name: ccache stats
        # always(): see the build matrix — stats must survive a failed/timed-out build.
        if: always()
        run: ccache --show-stats
      - name: Run tests
        run: |
          cd build
          # Coverage instrumentation runs ~2-3x slower, which makes some async/timing
          # tests (e.g. PBFT) flaky. This job only needs the tests to *execute* so the
          # .gcda data is produced; correctness is gated by the build matrix. Retry
          # flakes once and never let a flake block the coverage report.
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3 --repeat until-pass:2 || true
      - name: Generate coverage report
        run: |
          cd build
          # gcda was produced by gcc-16, so geninfo must use the matching gcov-16
          # (otherwise: "Incompatible GCC/GCOV version"). version/unused are tolerated
          # as a fallback across lcov point releases.
          IGN=inconsistent,source,gcov,mismatch,version,negative,empty,unused
          lcov --gcov-tool gcov-16 --capture --directory . \
            --output-file coverage.info.in --ignore-errors "$IGN"
          lcov --remove coverage.info.in \
            '/usr*' '*vcpkg_installed*' '*boost/*' '*test*' '*build*' '*deps*' \
            --output-file coverage.info --ignore-errors "$IGN"
          # geninfo records absolute SF: paths ($GITHUB_WORKSPACE/bcos-.../x.cpp).
          # Codecov needs repo-relative paths to map files; strip the workspace
          # prefix so it doesn't report a "files paths" error and 0% coverage.
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" coverage.info
          # The 'ctest || true' above tolerates flaky tests under instrumentation,
          # but if tests fail to run at ALL, coverage collapses toward 0%. Fail
          # rather than upload a misleading near-empty baseline (which would make
          # every subsequent PR delta look inflated). Real coverage is ~59%, so a
          # 20% floor only trips on a genuine no-run, not on flake tolerance.
          LINES_PCT=$(lcov --summary coverage.info --ignore-errors inconsistent,source 2>&1 \
            | sed -n 's/.*lines[.]*: \([0-9]*\)\..*/\1/p' | head -1)
          echo "Measured line coverage: ${LINES_PCT:-unknown}%"
          if [ -z "$LINES_PCT" ] || [ "$LINES_PCT" -lt 20 ]; then
            echo "::error::Line coverage ${LINES_PCT:-unknown}% is implausibly low; tests likely did not execute. Refusing to publish a misleading baseline." >&2
            exit 1
          fi
          genhtml coverage.info --output-directory CodeCoverage --ignore-errors "$IGN" || true
          {
            echo '## Code coverage (release-3.18.0)'
            echo '```'
            lcov --summary coverage.info --ignore-errors inconsistent,source 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload base-branch coverage to Codecov
        # Direct upload only for push events (base branches), which carry the
        # token and establish the baseline the project status compares against.
        # Pull requests (including fork PRs, which get no secrets here) are
        # uploaded by the coverage-comment workflow_run job instead, so it can
        # run with the token in the base-repo context.
        if: ${{ github.event_name == 'push' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.info
          # Upload only the clean lcov file. Without this, codecov-cli also
          # sweeps the build/ tree and uploads thousands of raw .gcov/.gcda
          # intermediates whose paths do not map to the repo, which makes
          # Codecov reject the whole commit as an unusable report.
          disable_search: true
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Record PR number for the comment workflow
        # Consumed by coverage-comment.yml (workflow_run) on master: the
        # workflow_run event does not expose the PR number for fork PRs, so pass
        # it via the artifact.
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > build/pr-number.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/coverage.info
            build/pr-number.txt
          retention-days: 7
      # The vcpkg save is earlier, right after Configure: see there for why.
      # Base-branch pushes only: a feature-branch push would write an entry no PR ever reads.
      - name: Save ccache
        if: '!cancelled() && github.event_name != ''pull_request'' && (github.ref_name == ''master'' || startsWith(github.ref_name, ''release-'')) && steps.ccache.outputs.cache-primary-key != '''''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      # The daily bucket bounds the write RATE, not the number of live entries: with 7-day
      # retention ~7 generations per scope would otherwise pile up. After the save, delete
      # every older generation of this scope's prefix on this ref; restore-keys only ever
      # reads the newest, so the older ones are dead weight. Non-fatal on purpose: a prune
      # failure costs cache budget, not the build, and the next push retries.
      # The prune only deletes after confirming today's entry is in the listing: an
      # actions/cache/save upload failure surfaces as a warning with a successful step
      # outcome, and without that gate a silent save failure would let the prune delete
      # yesterday's generation - the prefix's only entry - and cold-build the next run.
      - name: Prune previous ccache generations
        if: '!cancelled() && github.event_name != ''pull_request'' && (github.ref_name == ''master'' || startsWith(github.ref_name, ''release-'')) && steps.ccache.outputs.cache-primary-key != '''''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix='ccache-coverage-ubuntu-26.04-${{ runner.arch }}-v1-'
          keep="${prefix}${{ steps.ccache-bucket.outputs.day }}"
          if ! listing=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,ref); then
            echo "::warning::gh cache list failed; ccache reclamation deferred to the next push"
            exit 0
          fi
          if ! printf '%s' "$listing" | jq -e --arg keep "$keep" --arg ref "$GITHUB_REF" \
              'any(.[]; .ref == $ref and .key == $keep)' > /dev/null; then
            echo "::warning::today's ccache entry ${keep} is absent; skipping prune"
            exit 0
          fi
          ids=$(printf '%s' "$listing" | jq -r --arg prefix "$prefix" --arg keep "$keep" --arg ref "$GITHUB_REF" \
            '.[] | select(.ref == $ref) | select(.key | startswith($prefix)) | select(.key != $keep) | .id') \
            || { echo "::warning::cache listing parse failed; ccache reclamation deferred to the next push"; exit 0; }
          count=$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "pruning ${count} stale generation(s) under ${prefix} (keeping ${keep})"
          printf '%s\n' "$ids" | sed '/^$/d' | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::ccache generation prune failed; reclamation deferred to the next push"

  # Full-stack C2 devnet e2e. Reuses the build job's ubuntu-26.04 artifact
  # (same pattern as hive_smoke) so this job skips vcpkg configure + C++ build.
  # The L2 unit suites themselves need no dedicated leg: L2 mode is a runtime
  # genesis setting (executor.version >= 3), not a compile-time variant, and
  # WITH_L2_CONTRACTS=ON only wires forge custom targets that are not part of
  # the default build - so the build matrix's ctest already compiles and runs
  # every L2 suite, and its binary is byte-equivalent to what a separate L2
  # leg would produce.
  # STEP-SET TWIN of c2-e2e.yml's c2_e2e job (that one builds fisco-bcos from
  # source): every shared step must be edited in lockstep in both files.
  # Runs on every PR (the workflow itself is skipped only for docs-only changes). It
  # runs the FULL adversarial + kona leg (CONTEST=1, KONA_VERIFY=1) — the same depth
  # as the nightly c2-e2e.yml job, just reusing the build job's binary instead of
  # rebuilding fisco-bcos. The added dispute-game + kona time is a few minutes, judged
  # acceptable for per-PR coverage.
  c2_e2e:
    name: C2 deposit/withdraw e2e
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CONTEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # The e2e harness lives in FISCO-BCOS/op-stack-e2e-tests; pinned ref — bump it
      # in lockstep with node changes (its CI gates the harness itself).
      - name: Check out the op-e2e harness (op-stack-e2e-tests)
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          # FISCO-BCOS/op-stack-e2e-tests#13 moves the harness to the 3.18 config surface
          # ([engine_rpc], no [op_fork_schedule], separate config.ini / config.genesis, no
          # SystemConfig feature_flags slot). This is that PR's head commit, reachable through
          # refs/pull/13/head; re-pin to its merge commit on the default branch once it merges.
          # It descends from the previous pin 5a2ad071a, so it keeps the kona native replay
          # phase 3.6 and setup_c2.sh's [web3_rpc] enable_debug_api=true (kona-host's preimage
          # oracle).
          ref: dac984d09777de634279025b6f6013106ae42b5c
          path: .ci-op-e2e-tests

      - name: Download fisco-bcos artifact from the build job
        uses: actions/download-artifact@v4
        with:
          name: fisco-bcos-ubuntu-26-x86_64
          # upload-artifact stores the files relative to their least common
          # ancestor (build/), so downloading into build/ restores
          # build/fisco-bcos-air/fisco-bcos (eth-sync-check rides along but
          # is unused here).
          path: build

      - name: Ensure fisco-bcos executable
        run: chmod +x build/fisco-bcos-air/fisco-bcos

      - name: Install C2 system packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            wget python3-dev python3-pip git curl ca-certificates jq zip
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Moved from the removed l2_unit_suites job. The scenarios talk JSON-RPC
      # to a live A8 devnet (curl + jq, installed above) and SKIP themselves
      # when the devnet is absent, so they need no build artifacts.
      - name: L2 integration runner (SKIPs without the A8 devnet)
        run: bash tools/.ci/l2-integration/run-all.sh

      - name: Install Foundry (optimism contracts-bedrock pin)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Install just (op-deployer build)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
          just --version

      # kona-host / kona-client (rust/kona) are built with cargo for the native replay
      # verification leg. KONA_VERIFY follows CONTEST (1 here, so the replay runs) unless set
      # explicitly.
      - name: Set up Rust (kona build)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          # STEP-SET TWIN of c2-e2e.yml's Set up Go step: same "no go.mod/go.sum in this
          # repository" reasoning (setup-go's cache restore failed with "Some specified paths
          # were not resolved" every run), and the OP monorepo clone it would key on happens
          # later in this job.
          cache: false

      - name: Read OP monorepo pin
        id: op-pin
        run: |
          set -euo pipefail
          COMMIT=$(python3 -c "import json; print(json.load(open('.ci-op-e2e-tests/tools/op-e2e/versions.json'))['op_monorepo']['commit'])")
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Cache OP binaries
        id: op-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-op-monorepo
            .ci-c2-bins
          # BOTH paths are required. .ci-c2-bins carries the binaries, but .ci-op-monorepo must
          # stay in the entry even though the e2e itself only consumes the binaries: setup_c2.sh
          # ends with a versions.json check that ENFORCES op_monorepo.commit (`git -C $MONOREPO
          # rev-parse HEAD`), and c2-e2e.sh passes MONOREPO=$REPO_ROOT/.ci-op-monorepo. On a cache
          # hit the Build step is skipped, so an entry without the clone makes that check read ""
          # and the e2e aborts with "version manifest mismatch" - far from the cause. Do not
          # narrow this to .ci-c2-bins alone.
          # The kona cargo target/ tree and op-deployer's build outputs stay out of the entry
          # because the Build step rm -rf's them before the save (path-level ! exclusions do
          # not subtract a directory's recursive contents): both are rebuildable products of
          # the Build step, and the binaries the e2e actually consumes are the copies in
          # .ci-c2-bins.
          # The -kona1- token describes the cached binary SET: this entry now also carries
          # kona-host/kona-client (cargo build). A cache keyed only on the OP monorepo commit
          # would hit a pre-kona entry (op-deployer/op-node/op-batcher only) and skip the
          # kona build, failing the e2e step with "missing .../kona-host". Bump the token
          # whenever the cached binary set changes (e.g. the future cannon/MIPS leg).
          key: c2-op-${{ steps.op-pin.outputs.commit }}-kona1-${{ runner.os }}-${{ runner.arch }}

      - name: Build OP stack binaries
        if: steps.op-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-c2-bins
          if [ ! -d .ci-op-monorepo/.git ]; then
            git clone --filter=blob:none https://github.com/ethereum-optimism/optimism .ci-op-monorepo
          fi
          git -C .ci-op-monorepo fetch --depth=1 origin "${{ steps.op-pin.outputs.commit }}" \
            || git -C .ci-op-monorepo fetch origin
          git -C .ci-op-monorepo checkout -q "${{ steps.op-pin.outputs.commit }}"
          git -C .ci-op-monorepo submodule update --init superchain-registry
          bash .ci-op-monorepo/op-core/superchain/sync-superchain.sh
          # Plain go build omits artifacts.tzst; op-deployer apply fails without just build.
          # STEP-SET TWIN of c2-e2e.yml's Build OP stack binaries step, including this forge-pin
          # assertion: this job builds the binaries itself, so the e2e step runs with
          # SKIP_OP_BUILD=1 and tools/.ci/c2-e2e.sh's ensure_op_forge never executes.
          MISE_FORGE=$(yq -r '.tools.forge' .ci-op-monorepo/mise.toml 2>/dev/null || true)
          if [ -n "${MISE_FORGE}" ] && [ "${MISE_FORGE}" != "null" ]; then
            forge --version | grep -q "${MISE_FORGE}" || {
              echo "ERROR: forge $(forge --version) is not the mise.toml pin ${MISE_FORGE}"; exit 1; }
          fi
          (cd .ci-op-monorepo/op-deployer && just build)
          cp .ci-op-monorepo/op-deployer/bin/op-deployer "$GITHUB_WORKSPACE/.ci-c2-bins/op-deployer"
          (cd .ci-op-monorepo && go build -o "$GITHUB_WORKSPACE/.ci-c2-bins/op-batcher" ./op-batcher/cmd)
          (cd .ci-op-monorepo && go build -o "$GITHUB_WORKSPACE/.ci-c2-bins/op-node" ./op-node/cmd)
          (cd .ci-op-monorepo/rust && cargo build --release -p kona-host -p kona-client)
          cp .ci-op-monorepo/rust/target/release/kona-host "$GITHUB_WORKSPACE/.ci-c2-bins/kona-host"
          cp .ci-op-monorepo/rust/target/release/kona-client "$GITHUB_WORKSPACE/.ci-c2-bins/kona-client"
          # The cache entry carries .ci-op-monorepo but must not carry its build products:
          # actions/cache's ! path exclusions do not subtract a directory's recursive
          # contents (@actions/glob, implicitDescendants:false), so delete them here instead.
          rm -rf .ci-op-monorepo/rust/target .ci-op-monorepo/op-deployer/bin
      - name: Save OP binaries
        # Save split from restore: PRs never write. cache-hit != 'true' skips the save when the
        # entry already exists (pin unchanged), so only a pin bump on the base branch writes.
        # The path set and key MUST mirror the Cache OP binaries restore above exactly (both
        # paths, -kona1- token): a mismatch means the -kona1- entry is never created, the
        # restore misses forever, and every run pays the full OP + kona rebuild.
        if: github.event_name != 'pull_request' && steps.op-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-op-monorepo
            .ci-c2-bins
          key: c2-op-${{ steps.op-pin.outputs.commit }}-kona1-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch pinned Solidity deps
        run: bash tools/.ci/fetch-l2-contract-deps.sh

      - name: Forge build L2 contracts
        run: forge build
        working-directory: bcos-l2-contracts

      - name: Run C2 ephemeral e2e
        # SKIP_KONA_BUILD=1: kona-host/kona-client were already built by the Build OP stack
        # binaries step (this mirrors c2-e2e.yml's full-run twin). KONA_VERIFY follows CONTEST
        # (hard-set to "1" for this job), so the native replay verification runs against the
        # contest leg's dispute game.
        run: SKIP_OP_BUILD=1 SKIP_KONA_BUILD=1 bash tools/.ci/c2-e2e.sh
        env:
          REPO_ROOT: ${{ github.workspace }}
          BIN_DIR: ${{ github.workspace }}/.ci-c2-bins
          FISCO_BIN: ${{ github.workspace }}/build/fisco-bcos-air/fisco-bcos
          SKIP_FISCO_BUILD: "1"

  # Hive conformance gate (PR variant): the dockerised smoke suites plus a
  # host-level replay of one EEST fixture through the real import path
  # (tools/hive/test-local.sh). Catches genesis-conversion and import-lane
  # regressions in minutes; the full eels consume-rlp matrix runs nightly in
  # hive-nightly.yml. Reuses the build job's artifact (ubuntu-26.04 leg, which
  # enables TOOLS=ON for eth-sync-check), so this job skips the C++ build.
  hive_smoke:
    name: Hive smoke + import replay
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # Pinned hive revision; bump deliberately (client-interface changes in
      # hive need matching changes under tools/hive/clients/bcos/).
      - name: Check out hive
        uses: actions/checkout@v4
        with:
          repository: ethereum/hive
          ref: ae173f1ce15aed785e6c0945c2156a95819d21bf
          path: .ci-hive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build the hive binary
        run: cd .ci-hive && go build -o hive .

      - name: Download fisco-bcos + eth-sync-check artifact
        uses: actions/download-artifact@v4
        with:
          name: fisco-bcos-ubuntu-26-x86_64
          path: .

      - name: Install the bcos client into the hive checkout
        run: |
          chmod +x fisco-bcos-air/fisco-bcos tools/eth-sync-check/eth-sync-check
          BUILD_DIR=. bash tools/hive/build-local.sh .ci-hive

      # This hive revision exits 1 when ANY test fails (hive.go's fatal() on a
      # non-zero failCount), and smoke/genesis carries exactly two known
      # failures (pre-London geneses, see tools/hive/README.md "Known
      # limitations"), so tolerate the exit code here — the assert step below
      # parses the run JSON and is the real gate. A hard failure (image build,
      # docker daemon) leaves no run JSON behind and still fails the assert.
      - name: Run hive smoke suites
        run: cd .ci-hive && ./hive --sim "smoke/(genesis|network)" --client bcos || true

      # Gate on the run JSON: every test must pass except the allow-listed
      # known failures, which must fail EXACTLY (a fixed known failure turning
      # green also fails the check, so the allow-list cannot rot).
      - name: Assert smoke results
        run: |
          python3 tools/hive/check-hive-results.py --logs .ci-hive/workspace/logs \
            --sim smoke/genesis --expect-total 6 \
            --allow-fail "empty genesis (bcos)" --allow-fail "all forks (bcos)"
          python3 tools/hive/check-hive-results.py --logs .ci-hive/workspace/logs \
            --sim smoke/network --expect-total 2

      # EEST withdrawals test_large_amount fixture (Shanghai-at-genesis, empty
      # alloc): replay the convert -> import -> serve path on the host and pin
      # the served hashes byte-exactly.
      - name: Host-level import replay (EEST fixture)
        run: |
          # bash -e aborts a failing command substitution at the assignment, so
          # print the captured output on the failure path too — test-local.sh's
          # diagnostics (node.out tail, served hashes) are the whole point.
          out=$(BINARY="${GITHUB_WORKSPACE}/fisco-bcos-air/fisco-bcos" \
                TOOL="${GITHUB_WORKSPACE}/tools/eth-sync-check/eth-sync-check" \
                bash tools/hive/test-local.sh \
                  tools/hive/tests/withdrawals_large_amount.genesis.json \
                  tools/hive/tests/withdrawals_large_amount.chain.rlp 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qF "genesis block hash: 0xa759d4d7ff38ec00e88b69069e86d1de9b7be0824b92a6c79b37fca1e6efabab" || exit 1
          echo "$out" | grep -qF "0x1 0x6e8fb4aeae9c0247e35aedec84d933550541c1495e0cd65b83e794dab7f4a3d5" || exit 1

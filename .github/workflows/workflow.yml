name: Github runner
on:
  push:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            windows-2025,
          ]
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 11
        if: matrix.os != 'windows-2025'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v4
      - name: Set up Node.js 20
        if: matrix.os != 'windows-2025'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - name: Install macOS dependencies
        if: matrix.os == 'macos-15'
        run: brew install libomp autoconf automake libtool
      - name: Set up MSVC environment
        # The windows-2025 image ships Visual Studio 18 (2026), which the pinned
        # CMake 3.28 cannot recognize as a generator: generator auto-detection
        # falls back to "NMake Makefiles" and fails with "'nmake' '-?' failed"
        # because nothing put the VC tools on PATH. Use the Ninja generator with
        # cl.exe from the developer environment instead (version-agnostic).
        if: matrix.os == 'windows-2025'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions-rs/toolchain@v1
        if: matrix.os != 'windows-2025'
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Compute build flags
        if: matrix.os != 'windows-2025'
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "EXTRA_FLAGS=-DSTATIC_BUILD=ON" >> "$GITHUB_ENV"
          else
            echo "EXTRA_FLAGS=" >> "$GITHUB_ENV"
          fi
      - name: Configure for linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ${EXTRA_FLAGS} ..
      - name: Configure for linux arm
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=arm64-linux-release ${EXTRA_FLAGS} ..
      - name: Configure for macOS
        if: matrix.os == 'macos-15'
        run: |
          brew unlink cmake 2>/dev/null || true
          cmake --version
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build
          cd build
          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=${ARCH}-osx-release ${EXTRA_FLAGS} ..
      - name: Configure for windows
        if: matrix.os == 'windows-2025'
        run: |
          mkdir build -Force
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DALLOCATOR=default -DTESTS=OFF -DFULLNODE=OFF -DWITH_LIGHTNODE=OFF -DWITH_TARS_SERVICES=OFF -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static-release ..
      - name: Build
        run: |
          cd build
          cmake --build .
      - name: Test
        if: matrix.os != 'windows-2025'
        run: |
          cd build
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3
      - name: Download EEST fixtures
        if: matrix.os != 'windows-2025'
        run: |
          cd ${{ github.workspace }}
          # --fail: a 404 would otherwise write the error page into the tarball
          # and surface as a confusing tar error; --retry handles release hiccups.
          curl --fail --retry 3 -L -o fixtures_stable.tar.gz https://github.com/ethereum/execution-spec-tests/releases/download/v5.4.0/fixtures_stable.tar.gz
          tar -xzf fixtures_stable.tar.gz
          # The tarball may extract to fixtures_stable/; ensure we have fixtures/
          if [ -d fixtures_stable ] && [ ! -d fixtures ]; then
            mv fixtures_stable fixtures
          fi
      - name: Run EEST fixture tests
        if: matrix.os != 'windows-2025'
        run: |
          # pipefail so a runner crash (not just a low pass rate) fails the job.
          set -o pipefail
          cd build/ethereum-executor/tests
          ./eest-runner --fixture-dir ../../../fixtures/ --no-log 2>&1 | tee eest_output.txt
          PASS_RATE=$(sed -nE 's/.*Pass rate:[[:space:]]+([0-9]+)%.*/\1/p' eest_output.txt)
          echo "EEST pass rate: ${PASS_RATE}%"
          if [ -z "${PASS_RATE}" ] || [ "${PASS_RATE}" -lt 100 ]; then
            echo "::error::EEST pass rate ${PASS_RATE:-unknown}% is below 100% threshold"
            exit 1
          fi
          echo "::notice::EEST pass rate ${PASS_RATE}% meets the 100% threshold"
      - name: Upload fisco-bcos binary artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: fisco-bcos-ubuntu-24-x86_64
          path: build/fisco-bcos-air/fisco-bcos
          retention-days: 30
      # - name: Upload coverage report
      #   if: matrix.os == 'ubuntu-24.04'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-report
      #     path: build/coverage.info
      - name: prepare RPCAPI Tests
        if: matrix.os != 'windows-2025'
        run: |
          cd tools
          bash .ci/rpcapi_ci_prepare.sh
      - name: FISCO BCOS RpcApiTest
        if: matrix.os != 'windows-2025'
        uses: matt-ball/newman-action@v1.0.4
        with:
          collection: https://raw.githubusercontent.com/FISCO-BCOS/FISCOBCOS-RPC-API/main/fiscobcos.rpcapi.collection.json
      - name: Integration test - Air
        if: matrix.os != 'windows-2025' && matrix.os != 'macos-15'
        run: |
          cd tools
          bash .ci/ci_check_air.sh ${{ github.base_ref }} "true"
      - name: Ethereum executor integration test (executor_version=2)
        # Runs a single-node L2 chain with executor_version=2 (ethereum-executor),
        # pre-funds an EOA via genesis alloc, and drives a simple value transfer
        # reused from an EEST fixture through eth_sendRawTransaction /
        # eth_getTransactionReceipt / eth_getBalance. Requires the EEST fixtures
        # downloaded by the "Download EEST fixtures" step above. Linux only:
        # the node fails to bring up the RPC server on the macOS runners (the
        # harness discards the node's stderr, so the root cause is not yet
        # diagnosed; see the air test which likewise excludes macos-15). macOS
        # is excluded until the node startup issue is fixed.
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          # eth-account (tx signing) + requests (RPC). Handle PEP 668.
          python3 -m pip install --quiet eth-account requests 2>/dev/null || \
          pip3 install --quiet eth-account requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet eth-account requests 2>/dev/null || true
          bash tools/.ci/ci_check_eth_executor.sh
      - name: Single-node consensus mode integration test
        # Built-in single-node consensus mode ([consensus] enable_single_node_consensus):
        # builds a single-node AIR chain, patches config.ini to enable the mode (no
        # pbft/sealer/txpool), and drives eth_sendRawTransaction -> receipt / block reads.
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # eth-account (tx signing) + requests (RPC). Handle PEP 668.
          python3 -m pip install --quiet eth-account requests 2>/dev/null || \
          pip3 install --quiet eth-account requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet eth-account requests 2>/dev/null || true
          bash tools/.ci/ci_check_single_node_consensus.sh
      - name: Engine API integration test
        if: matrix.os != 'windows-2025'
        run: |
          # Install Python dependencies (handle macOS PEP 668 externally-managed-environment)
          python3 -m pip install --quiet requests 2>/dev/null || \
          pip3 install --quiet requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet requests 2>/dev/null || true
          # Run engine API integration test (curl smoke + Python mock CL)
          bash tools/engine_integration_test.sh build 8551
      - name: Reduce vcpkg cache size
        if: matrix.os != 'windows-2025'
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          du -sh build/vcpkg_installed 2>/dev/null  || true

          # 1) Remove only debug libraries — keep debug metadata/includes intact
          echo "Removing debug libraries..."
          find build/vcpkg_installed -path '*/debug/lib/*' \( -name "*.a" -o -name "*.so" -o -name "*.so.*" -o -name "*.dylib" \) -print -delete 2>/dev/null || true

          # 2) Strip release static libs (remove debug info, keep symbols needed for linking)
          echo "Stripping release static libraries..."
          find build/vcpkg_installed \( -name "*.a" -o -name "*.dylib" \) -print -exec strip -S {} \; 2>/dev/null || true

          # 3) Remove per-package build workdirs if present (already excluded from cache, paranoia)
          rm -rf build/vcpkg_installed/*/src 2>/dev/null || true

          echo "=== After cleanup ==="
          du -sh build/vcpkg_installed 2>/dev/null || true
      - name: Set packaging variables
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        id: pkgvars
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-24.04)
              PKG_OS=linux
              PKG_ARCH=x86_64
              ;;
            ubuntu-24.04-arm)
              PKG_OS=linux
              PKG_ARCH=aarch64
              ;;
            macos-15)
              PKG_OS=macOS
              PKG_ARCH=arm
              ;;
            *)
              PKG_OS=unknown
              PKG_ARCH=unknown
              ;;
          esac
          echo "PKG_OS=$PKG_OS" >> $GITHUB_ENV
          echo "PKG_ARCH=$PKG_ARCH" >> $GITHUB_ENV
          PKG_NAME="fisco-bcos-${PKG_OS}-${PKG_ARCH}.tar.gz"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          # also expose as step outputs for later reference
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
      - name: Create release tarball
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="build/fisco-bcos-air/fisco-bcos"
          if [[ ! -f "$BIN_PATH" ]]; then
            echo "Binary not found at $BIN_PATH" >&2
            ls -la build || true
            exit 1
          fi
          # Create tar.gz in repo root with only the binary inside (no extra folders)
          tar -C "$(dirname "$BIN_PATH")" -czf "${PKG_NAME}" "$(basename "$BIN_PATH")"
      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkgvars.outputs.pkg_name }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      # Surfaced as an env var so the upload step can be skipped when no token is
      # present. Fork PRs (pull_request event) receive NO secrets, so a tokenless
      # upload would be rate-limited and orphaned, leaving Codecov stuck at 0.00%
      # ("incomplete uploads on the first attempt"). The token-carrying run is the
      # push event on the base branch (and on a fork that sets the secret).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
            !${{ github.workspace }}/vcpkg/.git
            !${{ github.workspace }}/vcpkg/buildtrees
            !${{ github.workspace }}/vcpkg/packages
            !${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ hashFiles( 'vcpkg.json' ) }}-${{ hashFiles( 'vcpkg-configuration.json' ) }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v1
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure with coverage
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTESTS=ON -DCOVERAGE=ON -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOLS=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
      - name: Build
        run: |
          cd build
          cmake --build . --parallel 3
      - name: Run tests
        run: |
          cd build
          # Coverage instrumentation runs ~2-3x slower, which makes some async/timing
          # tests (e.g. PBFT) flaky. This job only needs the tests to *execute* so the
          # .gcda data is produced; correctness is gated by the build matrix. Retry
          # flakes once and never let a flake block the coverage report.
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3 --repeat until-pass:2 || true
      - name: Generate coverage report
        run: |
          cd build
          # gcda was produced by gcc-14, so geninfo must use the matching gcov-14
          # (otherwise: "Incompatible GCC/GCOV version"). version/unused are tolerated
          # as a fallback across lcov point releases.
          IGN=inconsistent,source,gcov,mismatch,version,negative,empty,unused
          lcov --gcov-tool gcov-14 --capture --directory . \
            --output-file coverage.info.in --ignore-errors "$IGN"
          lcov --remove coverage.info.in \
            '/usr*' '*vcpkg_installed*' '*boost/*' '*test*' '*build*' '*deps*' \
            --output-file coverage.info --ignore-errors "$IGN"
          # geninfo records absolute SF: paths ($GITHUB_WORKSPACE/bcos-.../x.cpp).
          # Codecov needs repo-relative paths to map files; strip the workspace
          # prefix so it doesn't report a "files paths" error and 0% coverage.
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" coverage.info
          # The 'ctest || true' above tolerates flaky tests under instrumentation,
          # but if tests fail to run at ALL, coverage collapses toward 0%. Fail
          # rather than upload a misleading near-empty baseline (which would make
          # every subsequent PR delta look inflated). Real coverage is ~59%, so a
          # 20% floor only trips on a genuine no-run, not on flake tolerance.
          LINES_PCT=$(lcov --summary coverage.info --ignore-errors inconsistent,source 2>&1 \
            | sed -n 's/.*lines[.]*: \([0-9]*\)\..*/\1/p' | head -1)
          echo "Measured line coverage: ${LINES_PCT:-unknown}%"
          if [ -z "$LINES_PCT" ] || [ "$LINES_PCT" -lt 20 ]; then
            echo "::error::Line coverage ${LINES_PCT:-unknown}% is implausibly low; tests likely did not execute. Refusing to publish a misleading baseline." >&2
            exit 1
          fi
          genhtml coverage.info --output-directory CodeCoverage --ignore-errors "$IGN" || true
          {
            echo '## Code coverage (release-3.18.0)'
            echo '```'
            lcov --summary coverage.info --ignore-errors inconsistent,source 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload base-branch coverage to Codecov
        # Direct upload only for push events (base branches), which carry the
        # token and establish the baseline the project status compares against.
        # Pull requests (including fork PRs, which get no secrets here) are
        # uploaded by the coverage-comment workflow_run job instead, so it can
        # run with the token in the base-repo context.
        if: ${{ github.event_name == 'push' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.info
          # Upload only the clean lcov file. Without this, codecov-cli also
          # sweeps the build/ tree and uploads thousands of raw .gcov/.gcda
          # intermediates whose paths do not map to the repo, which makes
          # Codecov reject the whole commit as an unusable report.
          disable_search: true
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Record PR number for the comment workflow
        # Consumed by coverage-comment.yml (workflow_run) on master: the
        # workflow_run event does not expose the PR number for fork PRs, so pass
        # it via the artifact.
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > build/pr-number.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/coverage.info
            build/pr-number.txt
          retention-days: 7

  # Dedicated, lightweight leg for the OP-Stack L2 mode. Kept OUT of the 5-OS
  # `build` matrix on purpose: multiplying that matrix by an l2 dimension would
  # double an already heavy C++ build for no extra coverage. L2 mode is a
  # runtime genesis feature flag (feature_l2_ethereum_compat), not a
  # compile-time variant, so a matrix axis would just rebuild identical
  # binaries. This job builds once on ubuntu with WITH_L2_CONTRACTS=ON and runs
  # only the L2-relevant unit suites, then the integration runner (which SKIPs
  # itself when the A8 devnet is absent).
  l2_unit_suites:
    name: L2 unit suites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v4
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - name: Install Foundry
        # WITH_L2_CONTRACTS=ON does find_program(FORGE forge REQUIRED) at
        # configure time, so forge must be on PATH before cmake runs.
        # Pinned to 1.5.1: golden storage-layout fixtures and --json output
        # shape were generated by this version. Do not upgrade without
        # regenerating storage-layout/*.json and reviewing the diff.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1
      - name: Configure (WITH_L2_CONTRACTS=ON)
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold -DTESTS=ON -DCOVERAGE=OFF -DWITH_L2_CONTRACTS=ON -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
      - name: Build
        run: |
          cd build
          cmake --build .
      - name: Run L2 unit suites
        run: |
          cd build
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3 -R \
            'NodeConfigAllocsTest|GenesisStateRootTest|LedgerGenesisL2Test|LedgerGenesisAllocsHashTest|FeatureL2FlagTest|L2ConfigLoaderTest|PrecompiledMapDisabledInL2Test|PrecompiledMapProductionInvariantTest|KzgPrecompileRegisteredTest|EthEndpointSystemConfigTest'
      - name: L2 integration runner (SKIPs without the A8 devnet)
        run: bash tools/.ci/l2-integration/run-all.sh

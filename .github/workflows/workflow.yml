name: Github runner
on:
  push:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Changelog.md"
      - "README.md"
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            windows-2025,
          ]
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 11
        if: matrix.os != 'windows-2025'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v4
      - name: Set up Node.js 20
        if: matrix.os != 'windows-2025'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - name: Install macOS dependencies
        if: matrix.os == 'macos-15'
        run: brew install libomp autoconf automake libtool
      - name: Set up MSVC environment
        # The windows-2025 image ships Visual Studio 18 (2026), which the pinned
        # CMake 3.28 cannot recognize as a generator: generator auto-detection
        # falls back to "NMake Makefiles" and fails with "'nmake' '-?' failed"
        # because nothing put the VC tools on PATH. Use the Ninja generator with
        # cl.exe from the developer environment instead (version-agnostic).
        if: matrix.os == 'windows-2025'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions-rs/toolchain@v1
        if: matrix.os != 'windows-2025'
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Compute build flags
        if: matrix.os != 'windows-2025'
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "EXTRA_FLAGS=-DSTATIC_BUILD=ON" >> "$GITHUB_ENV"
          else
            echo "EXTRA_FLAGS=" >> "$GITHUB_ENV"
          fi
      - name: Configure for linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ${EXTRA_FLAGS} ..
      - name: Configure for linux arm
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=arm64-linux-release ${EXTRA_FLAGS} ..
      - name: Configure for macOS
        if: matrix.os == 'macos-15'
        run: |
          brew unlink cmake 2>/dev/null || true
          cmake --version
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build
          cd build
          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DTESTS=ON -DCOVERAGE=OFF -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=${ARCH}-osx-release ${EXTRA_FLAGS} ..
      - name: Configure for windows
        if: matrix.os == 'windows-2025'
        run: |
          mkdir build -Force
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DALLOCATOR=default -DTESTS=OFF -DFULLNODE=OFF -DWITH_LIGHTNODE=OFF -DWITH_TARS_SERVICES=OFF -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static-release ..
      - name: Build
        run: |
          cd build
          cmake --build .
      - name: Checkout op-stack-e2e-tests assets
        # Black-box e2e drivers, genesis toolchain and t8n generator live in the
        # standalone repo FISCO-BCOS/op-stack-e2e-tests (CI triggers stay here).
        # Symlinked into the historical in-tree paths so scripts, CMake macros and
        # the regen action below are unchanged. Pin = the asset-repo commit this
        # repo's tests are verified against; bump deliberately.
        if: matrix.os != 'windows-2025'
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          ref: b82691ac133a94637da9e6969a63f86279c6b0a2
          path: e2e-tests
      - name: Symlink e2e assets into in-tree paths
        if: matrix.os != 'windows-2025'
        # Clear destinations first: plain `ln -s` into an existing path nests the link
        # inside it (tools/opstack-genesis is a tracked directory), and `ln -sfn` cannot
        # overwrite a real directory either. The trailing test fails the step if the
        # opstack-genesis link did not land.
        run: |
          rm -rf "$GITHUB_WORKSPACE/tools/op-e2e" \
            "$GITHUB_WORKSPACE/tools/opstack-genesis" \
            "$GITHUB_WORKSPACE/opstack-executor/tests/t8n"
          ln -s "$GITHUB_WORKSPACE/e2e-tests/tools/op-e2e" "$GITHUB_WORKSPACE/tools/op-e2e"
          ln -s "$GITHUB_WORKSPACE/e2e-tests/tools/opstack-genesis" "$GITHUB_WORKSPACE/tools/opstack-genesis"
          ln -s "$GITHUB_WORKSPACE/e2e-tests/opstack-executor/tests/t8n" "$GITHUB_WORKSPACE/opstack-executor/tests/t8n"
          test -f tools/opstack-genesis/build-allocs.py
      - name: Regenerate opstack t8n vectors
        # The opstack t8n tests (opstack-executor-block-tests) read reference vectors
        # from the source tree at runtime; the JSON is git-ignored and regenerated here
        # from pinned op-geth before `ctest`. Windows builds with -DTESTS=OFF, so no tests.
        if: matrix.os != 'windows-2025'
        uses: FISCO-BCOS/op-stack-e2e-tests/.github/actions/opstack-t8n-regen@b82691ac133a94637da9e6969a63f86279c6b0a2
      - name: Test
        if: matrix.os != 'windows-2025'
        run: |
          cd build
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3
      - name: Fork-label coverage guard
        # WI-32 gate 3/4.
        # Read-only, so it MUST run before the mutation harness below (which leaves
        # variant-mutated BINARIES behind even after restoring the source — see the
        # ordering contract on that step). Boost.Test renders decorator labels in
        # `--list_content=DOT` as `labels: @fork-<name> ...`; all nine fork labels
        # must still be present on each fork-labelled binary, so a refactor that
        # drops a fork's cases (or its decorator) fails fast instead of silently
        # shrinking the matrix. Counting rule: presence/positive counts, never the
        # "errors detected" substring (Boost's success banner contains it).
        # Linux-only: the corpus is regenerated only on the non-Windows legs and one
        # leg is enough for a label inventory.
        if: matrix.os == 'ubuntu-24.04'
        run: |
          bash tools/.ci/check-fork-labels.sh \
            build/bcos-evm/test/bcos-evm-opstack-tests \
            build/engine/test/test-bcos-engine \
            build/opstack-executor/tests/opstack-executor-block-tests
      - name: Mutation harness (reverse-fix variants must go RED)
        # WI-32 gate 1/4.
        # ORDERING CONTRACT — do not move this before the build/ctest phase without
        # first fixing run.sh: tools/mutation/run.sh restores each variant's mutated
        # SOURCE (`git checkout HEAD -- <file>`) but does NOT rebuild the target back
        # to the unmutated state, so it leaves a variant-mutated BINARY behind (the
        # last variant processed). Any test step running after this would execute
        # that mutated binary and report false failures. It therefore runs AFTER
        # `Test` above, which is also the phase whose validity it audits: a variant
        # that stays GREEN under its mapped filter is a matrix blind spot, and a
        # negative-control filter that goes RED means the mutation is not attributed.
        # The harness restores the source on every exit path and ends with a
        # `git status --porcelain` cleanliness gate over every mapped file.
        if: matrix.os == 'ubuntu-24.04' && github.event_name != 'release'
        run: |
          # The variant patches are applied with `git apply --3way`, which lazily
          # fetches the pre-image BLOBS the patches were authored against; a
          # fetch-depth=1 checkout cannot serve them and GitHub refuses blob-by-SHA
          # lazy wants ("not our ref"), so unshallow once — the pack is ~2 GiB and
          # takes about a minute on a hosted runner.
          #
          # --unshallow fetches every origin ref, and if submodule recursion is on
          # it then walks the populated vcpkg submodule too: some historical ref of
          # this repo records a vcpkg gitlink (d14033c16…) that microsoft/vcpkg no
          # longer serves, and the resulting "not our ref" kills the step before
          # run.sh starts (PR #5615). Only superproject blobs are needed here, so
          # recursion is off for this fetch.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git -c fetch.recurseSubmodules=no fetch --unshallow
          fi
          bash tools/mutation/run.sh
      - name: Download EEST fixtures
        if: matrix.os != 'windows-2025'
        run: |
          cd ${{ github.workspace }}
          # --fail: a 404 would otherwise write the error page into the tarball
          # and surface as a confusing tar error; --retry handles release hiccups.
          curl --fail --retry 3 -L -o fixtures_stable.tar.gz https://github.com/ethereum/execution-spec-tests/releases/download/v5.4.0/fixtures_stable.tar.gz
          tar -xzf fixtures_stable.tar.gz
          # The tarball may extract to fixtures_stable/; ensure we have fixtures/
          if [ -d fixtures_stable ] && [ ! -d fixtures ]; then
            mv fixtures_stable fixtures
          fi
      - name: Run EEST fixture tests
        if: matrix.os != 'windows-2025'
        run: |
          # pipefail so a runner crash (not just a low pass rate) fails the job.
          set -o pipefail
          cd build/ethereum-executor/tests
          ./eest-runner --fixture-dir ../../../fixtures/ --no-log 2>&1 | tee eest_output.txt
          PASS_RATE=$(sed -nE 's/.*Pass rate:[[:space:]]+([0-9]+)%.*/\1/p' eest_output.txt)
          echo "EEST pass rate: ${PASS_RATE}%"
          if [ -z "${PASS_RATE}" ] || [ "${PASS_RATE}" -lt 100 ]; then
            echo "::error::EEST pass rate ${PASS_RATE:-unknown}% is below 100% threshold"
            exit 1
          fi
          echo "::notice::EEST pass rate ${PASS_RATE}% meets the 100% threshold"
      - name: Upload fisco-bcos binary artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: fisco-bcos-ubuntu-24-x86_64
          path: build/fisco-bcos-air/fisco-bcos
          retention-days: 30
      # - name: Upload coverage report
      #   if: matrix.os == 'ubuntu-24.04'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-report
      #     path: build/coverage.info
      - name: prepare RPCAPI Tests
        if: matrix.os != 'windows-2025'
        run: |
          cd tools
          bash .ci/rpcapi_ci_prepare.sh
      - name: FISCO BCOS RpcApiTest
        if: matrix.os != 'windows-2025'
        uses: matt-ball/newman-action@v1.0.4
        with:
          collection: https://raw.githubusercontent.com/FISCO-BCOS/FISCOBCOS-RPC-API/main/fiscobcos.rpcapi.collection.json
      - name: Integration test - Air
        if: matrix.os != 'windows-2025' && matrix.os != 'macos-15'
        run: |
          cd tools
          bash .ci/ci_check_air.sh ${{ github.base_ref }} "true"
      - name: Ethereum executor integration test (executor_version=2)
        # Runs a single-node L2 chain with executor_version=2 (ethereum-executor),
        # pre-funds an EOA via genesis alloc, and drives a simple value transfer
        # reused from an EEST fixture through eth_sendRawTransaction /
        # eth_getTransactionReceipt / eth_getBalance. Requires the EEST fixtures
        # downloaded by the "Download EEST fixtures" step above. Linux only:
        # the node fails to bring up the RPC server on the macOS runners (the
        # harness discards the node's stderr, so the root cause is not yet
        # diagnosed; see the air test which likewise excludes macos-15). macOS
        # is excluded until the node startup issue is fixed.
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          # eth-account (tx signing) + requests (RPC). Handle PEP 668.
          python3 -m pip install --quiet eth-account requests 2>/dev/null || \
          pip3 install --quiet eth-account requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet eth-account requests 2>/dev/null || true
          bash tools/.ci/ci_check_eth_executor.sh
      - name: Single-node consensus mode integration test
        # Built-in single-node consensus mode ([consensus] enable_single_node_consensus):
        # builds a single-node AIR chain, patches config.ini to enable the mode (no
        # pbft/sealer/txpool), and drives eth_sendRawTransaction -> receipt / block reads.
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # eth-account (tx signing) + requests (RPC). Handle PEP 668.
          python3 -m pip install --quiet eth-account requests 2>/dev/null || \
          pip3 install --quiet eth-account requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet eth-account requests 2>/dev/null || true
          bash tools/.ci/ci_check_single_node_consensus.sh
      - name: Engine API integration test
        if: matrix.os != 'windows-2025'
        run: |
          # Install Python dependencies (handle macOS PEP 668 externally-managed-environment)
          python3 -m pip install --quiet requests 2>/dev/null || \
          pip3 install --quiet requests 2>/dev/null || \
          pip3 install --break-system-packages --quiet requests 2>/dev/null || true
          # Run engine API integration test (curl smoke + Python mock CL)
          bash tools/engine_integration_test.sh build 8551
      - name: Reduce vcpkg cache size
        if: matrix.os != 'windows-2025'
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          du -sh build/vcpkg_installed 2>/dev/null  || true

          # 1) Remove only debug libraries — keep debug metadata/includes intact
          echo "Removing debug libraries..."
          find build/vcpkg_installed -path '*/debug/lib/*' \( -name "*.a" -o -name "*.so" -o -name "*.so.*" -o -name "*.dylib" \) -print -delete 2>/dev/null || true

          # 2) Strip release static libs (remove debug info, keep symbols needed for linking)
          echo "Stripping release static libraries..."
          find build/vcpkg_installed \( -name "*.a" -o -name "*.dylib" \) -print -exec strip -S {} \; 2>/dev/null || true

          # 3) Remove per-package build workdirs if present (already excluded from cache, paranoia)
          rm -rf build/vcpkg_installed/*/src 2>/dev/null || true

          echo "=== After cleanup ==="
          du -sh build/vcpkg_installed 2>/dev/null || true
      - name: Set packaging variables
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        id: pkgvars
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-24.04)
              PKG_OS=linux
              PKG_ARCH=x86_64
              ;;
            ubuntu-24.04-arm)
              PKG_OS=linux
              PKG_ARCH=aarch64
              ;;
            macos-15)
              PKG_OS=macOS
              PKG_ARCH=arm
              ;;
            *)
              PKG_OS=unknown
              PKG_ARCH=unknown
              ;;
          esac
          echo "PKG_OS=$PKG_OS" >> $GITHUB_ENV
          echo "PKG_ARCH=$PKG_ARCH" >> $GITHUB_ENV
          PKG_NAME="fisco-bcos-${PKG_OS}-${PKG_ARCH}.tar.gz"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          # also expose as step outputs for later reference
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
      - name: Create release tarball
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="build/fisco-bcos-air/fisco-bcos"
          if [[ ! -f "$BIN_PATH" ]]; then
            echo "Binary not found at $BIN_PATH" >&2
            ls -la build || true
            exit 1
          fi
          # Create tar.gz in repo root with only the binary inside (no extra folders)
          tar -C "$(dirname "$BIN_PATH")" -czf "${PKG_NAME}" "$(basename "$BIN_PATH")"
      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' && matrix.os != 'windows-2025'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkgvars.outputs.pkg_name }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      # Surfaced as an env var so the upload step can be skipped when no token is
      # present. Fork PRs (pull_request event) receive NO secrets, so a tokenless
      # upload would be rate-limited and orphaned, leaving Codecov stuck at 0.00%
      # ("incomplete uploads on the first attempt"). The token-carrying run is the
      # push event on the base branch (and on a fork that sets the secret).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
            !${{ github.workspace }}/vcpkg/.git
            !${{ github.workspace }}/vcpkg/buildtrees
            !${{ github.workspace }}/vcpkg/packages
            !${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ hashFiles( 'vcpkg.json' ) }}-${{ hashFiles( 'vcpkg-configuration.json' ) }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v1
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              lcov wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure with coverage
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTESTS=ON -DCOVERAGE=ON -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOLS=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
      - name: Build
        run: |
          cd build
          cmake --build . --parallel 3
      - name: Checkout op-stack-e2e-tests assets
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          ref: b82691ac133a94637da9e6969a63f86279c6b0a2
          path: e2e-tests
      - name: Symlink e2e assets into in-tree paths
        run: |
          ln -s "$GITHUB_WORKSPACE/e2e-tests/tools/op-e2e" "$GITHUB_WORKSPACE/tools/op-e2e"
          ln -s "$GITHUB_WORKSPACE/e2e-tests/tools/opstack-genesis" "$GITHUB_WORKSPACE/tools/opstack-genesis"
          ln -s "$GITHUB_WORKSPACE/e2e-tests/opstack-executor/tests/t8n" "$GITHUB_WORKSPACE/opstack-executor/tests/t8n"
      - name: Regenerate opstack t8n vectors
        uses: FISCO-BCOS/op-stack-e2e-tests/.github/actions/opstack-t8n-regen@b82691ac133a94637da9e6969a63f86279c6b0a2
      - name: Run tests
        run: |
          cd build
          # Coverage instrumentation runs ~2-3x slower, which makes some async/timing
          # tests (e.g. PBFT) flaky. This job only needs the tests to *execute* so the
          # .gcda data is produced; correctness is gated by the build matrix. Retry
          # flakes once and never let a flake block the coverage report.
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3 --repeat until-pass:2 || true
      - name: Generate coverage report
        run: |
          cd build
          # gcda was produced by gcc-14, so geninfo must use the matching gcov-14
          # (otherwise: "Incompatible GCC/GCOV version"). version/unused are tolerated
          # as a fallback across lcov point releases.
          IGN=inconsistent,source,gcov,mismatch,version,negative,empty,unused
          lcov --gcov-tool gcov-14 --capture --directory . \
            --output-file coverage.info.in --ignore-errors "$IGN"
          lcov --remove coverage.info.in \
            '/usr*' '*vcpkg_installed*' '*boost/*' '*test*' '*build*' '*deps*' \
            --output-file coverage.info --ignore-errors "$IGN"
          # geninfo records absolute SF: paths ($GITHUB_WORKSPACE/bcos-.../x.cpp).
          # Codecov needs repo-relative paths to map files; strip the workspace
          # prefix so it doesn't report a "files paths" error and 0% coverage.
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" coverage.info
          # The 'ctest || true' above tolerates flaky tests under instrumentation,
          # but if tests fail to run at ALL, coverage collapses toward 0%. Fail
          # rather than upload a misleading near-empty baseline (which would make
          # every subsequent PR delta look inflated). Real coverage is ~59%, so a
          # 20% floor only trips on a genuine no-run, not on flake tolerance.
          LINES_PCT=$(lcov --summary coverage.info --ignore-errors inconsistent,source 2>&1 \
            | sed -n 's/.*lines[.]*: \([0-9]*\)\..*/\1/p' | head -1)
          echo "Measured line coverage: ${LINES_PCT:-unknown}%"
          if [ -z "$LINES_PCT" ] || [ "$LINES_PCT" -lt 20 ]; then
            echo "::error::Line coverage ${LINES_PCT:-unknown}% is implausibly low; tests likely did not execute. Refusing to publish a misleading baseline." >&2
            exit 1
          fi
          genhtml coverage.info --output-directory CodeCoverage --ignore-errors "$IGN" || true
          {
            echo '## Code coverage (release-3.18.0)'
            echo '```'
            lcov --summary coverage.info --ignore-errors inconsistent,source 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload base-branch coverage to Codecov
        # Direct upload only for push events (base branches), which carry the
        # token and establish the baseline the project status compares against.
        # Pull requests (including fork PRs, which get no secrets here) are
        # uploaded by the coverage-comment workflow_run job instead, so it can
        # run with the token in the base-repo context.
        if: ${{ github.event_name == 'push' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.info
          # Upload only the clean lcov file. Without this, codecov-cli also
          # sweeps the build/ tree and uploads thousands of raw .gcov/.gcda
          # intermediates whose paths do not map to the repo, which makes
          # Codecov reject the whole commit as an unusable report.
          disable_search: true
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Record PR number for the comment workflow
        # Consumed by coverage-comment.yml (workflow_run) on master: the
        # workflow_run event does not expose the PR number for fork PRs, so pass
        # it via the artifact.
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > build/pr-number.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/coverage.info
            build/pr-number.txt
          retention-days: 7

  # Dedicated, lightweight leg for the OP-Stack L2 mode. Kept OUT of the 5-OS
  # `build` matrix on purpose: multiplying that matrix by an l2 dimension would
  # double an already heavy C++ build for no extra coverage. L2 mode is a
  # runtime genesis feature flag (feature_l2_ethereum_compat), not a
  # compile-time variant, so a matrix axis would just rebuild identical
  # binaries. This job builds once on ubuntu with WITH_L2_CONTRACTS=ON and runs
  # only the L2-relevant unit suites, then the integration runner (which SKIPs
  # itself when the A8 devnet is absent).
  l2_unit_suites:
    name: L2 unit suites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        shell: bash
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'ports/**' ) }}-${{ steps.vcpkg-revision.outputs.revision }}-${{ runner.os }}-${{ runner.arch }}-cache-key-v4
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - name: Install Foundry
        # WITH_L2_CONTRACTS=ON does find_program(FORGE forge REQUIRED) at
        # configure time, so forge must be on PATH before cmake runs.
        # Pinned to 1.5.1: golden storage-layout fixtures and --json output
        # shape were generated by this version. Do not upgrade without
        # regenerating storage-layout/*.json and reviewing the diff.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1
      - name: Configure (WITH_L2_CONTRACTS=ON)
        run: |
          mkdir -p build
          cd build
          CC=gcc-14 CXX=g++-14 cmake -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DLINKER=mold -DTESTS=ON -DCOVERAGE=OFF -DWITH_L2_CONTRACTS=ON -DWITH_LIGHTNODE=ON -DWITH_CPPSDK=ON -DWITH_TIKV=OFF -DWITH_TARS_SERVICES=OFF -DTOOL=OFF -DVCPKG_TARGET_TRIPLET=x64-linux-release ..
      - name: Build
        run: |
          cd build
          cmake --build .
      - name: Run L2 unit suites
        run: |
          cd build
          CTEST_OUTPUT_ON_FAILURE=TRUE ctest -j3 -R \
            'NodeConfigAllocsTest|GenesisStateRootTest|LedgerGenesisL2Test|LedgerGenesisAllocsHashTest|FeatureL2FlagTest|L2ConfigLoaderTest|PrecompiledMapDisabledInL2Test|PrecompiledMapProductionInvariantTest|KzgPrecompileRegisteredTest|EthEndpointSystemConfigTest|MultiVersionSchedulerTest'
      - name: Assert the module suites are registered with ctest
        run: |
          cd build
          # A module suite can be compiled and linked yet never registered with ctest (its
          # directory is added before testing is enabled in the parent scope), so it runs
          # nowhere; this step turns that silence into a failure.
          for suite in MultiVersionSchedulerTest; do
            ctest -N -R "${suite}" | grep -qE "Total Tests: [1-9]" || {
              echo "ERROR: ${suite} is built but not registered with ctest"; exit 1; }
          done
      - name: L2 integration runner (SKIPs without the A8 devnet)
        run: bash tools/.ci/l2-integration/run-all.sh
      - name: Upload fisco-bcos for C2 e2e
        uses: actions/upload-artifact@v4
        with:
          name: fisco-bcos-l2-ubuntu
          path: build/fisco-bcos-air/fisco-bcos
          retention-days: 1

  # ==========================================================================
  # WI-32 gates 2/4 (oracle pin consistency) + 4/4 (F-A4 corpus ref) + the
  # registry-citation convention check (deliverable 5).
  #
  # Deliberately NOT a build leg: it needs only git metadata, the corpus checkout
  # and (optionally) a specs checkout, so it finishes in seconds and fails with a
  # precise message instead of surfacing as a cryptic test failure inside the
  # heavy build matrix.
  #
  # F-A4 — THREE INDEPENDENT PIN AXES, never conflate them:
  #   * op-geth pin (authoritative) e8800cffe53d459cde8a07c8e8f1de9d86e79e07:
  #     the execution-client revision the oracle / golden samples are generated
  #     from. Asserted consistent across regen.sh, op_geth_oracle.json,
  #     tools/op-geth-oracle/extract.sh, GoldenSample.h and the provenance test.
  #   * corpus-repo ref b82691ac133a94637da9e6969a63f86279c6b0a2: the
  #     FISCO-BCOS/op-stack-e2e-tests commit whose generator CI runs. A DIFFERENT
  #     axis, NOT an op-geth pin (this conflation was F-A4).
  #   * C2 harness ref e7cded80ad98e9c85a1fecc475ce201d55f773ea: same repo as the
  #     corpus ref, deliberately a different commit — the C2 jobs need a harness
  #     whose tools/op-e2e/versions.json pins a real monorepo commit (see Axis 4 in
  #     check-ci-pins.sh). Carrying the corpus ref there broke the C2 job in #5615.
  #
  # RESOLVED (was the BLOCKING NOTE): the corpus ref now postdates the getPayload
  # goldens (afe06e2), the matrix/ artifacts (f1fc9a3) and the generator-side
  # bookkeeping + envelope wiring (625f0f6, a908a6d) — the pinned ref's regen
  # produces everything the provenance/matrix tests require, so the ci_pins gate
  # below passes and the getPayload provenance case is satisfiable in CI. The gate
  # stays as the canary: a future ref bump that regresses below those corpus
  # commits fails fast again, by design. Never silence it by weakening the tests.
  # ==========================================================================
  ci_pins:
    name: CI pin gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Checkout op-stack-e2e-tests (clone; ref applied next step)
        # Cloned via actions/checkout so the token/auth setup matches the build job
        # (works whether the corpus repo is public or org-private). The commit ref
        # itself is NOT hardcoded here: it is parsed from workflow.yml in the next
        # step, so this job adds no fourth place to bump.
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          path: e2e-tests
      - name: Pin the corpus at the ref workflow.yml names
        run: |
          set -euo pipefail
          REF="$(grep -oE 'opstack-t8n-regen@[0-9a-f]{40}' .github/workflows/workflow.yml \
            | sed 's/.*@//' | sort -u | head -1)"
          if [ -z "$REF" ]; then
            echo "::error::no opstack-t8n-regen@<40-hex> ref found in workflow.yml"
            exit 1
          fi
          git -C e2e-tests fetch -q --depth 1 origin "$REF"
          git -C e2e-tests checkout -q --detach FETCH_HEAD
          echo "corpus checkout: $(git -C e2e-tests rev-parse HEAD)"
      - name: Checkout ethereum-optimism/specs for citation resolution
        # Deliverable 5. Enforcing when the tree is present, but a third-party
        # outage must not block this repo: continue-on-error degrades to a
        # ::notice:: inside the script. The script hard-fails a citation that does
        # not resolve at the pinned specs revision.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ethereum-optimism/specs
          ref: 564a0ceae302eaf465edc7ff8ab55850624a11a0
          path: ci-specs
      - name: Pin consistency, corpus artifacts, citation reproducibility
        env:
          CORPUS_DIR: ${{ github.workspace }}/e2e-tests
          SPECS_DIR: ${{ github.workspace }}/ci-specs
        run: bash tools/.ci/check-ci-pins.sh

  # Full-stack C2 devnet e2e. Reuses the fisco-bcos binary built by
  # l2_unit_suites (artifact) so this job skips vcpkg configure + C++ build.
  # STEP-SET TWIN of c2-e2e.yml's c2_e2e job (that one builds fisco-bcos from
  # source): every shared step must be edited in lockstep in both files.
  # Runs on every PR (the workflow itself is skipped only for docs-only changes). The
  # smoke variant keeps it inside a few minutes; the full adversarial run
  # (CONTEST=1) is scheduled nightly in c2-e2e.yml.
  c2_e2e:
    name: C2 deposit/withdraw e2e
    needs: [l2_unit_suites]
    if: needs.l2_unit_suites.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CONTEST: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # The e2e harness lives in FISCO-BCOS/op-stack-e2e-tests; pinned ref — bump it
      # in lockstep with node changes (its CI gates the harness itself).
      #
      # THIRD PIN AXIS — do not conflate with the t8n corpus ref (see the
      # pin-consistency gate comment above): the corpus ref b82691ac feeds
      # opstack-t8n-regen and the in-tree vectors; THIS ref supplies the C2
      # scripts AND tools/op-e2e/versions.json, whose op_monorepo.commit the job
      # checks out of ethereum-optimism/optimism. At corpus ref b82691ac that
      # file still carried op_monorepo.commit = 5f90f749c… — the op-revm oracle
      # revision, which does not exist in the monorepo — so the C2 job died
      # during the monorepo checkout ("not our ref", PR #5615). Hence: this ref must be a
      # harness commit that postdates the versions.json fix; keep it equal to
      # c2-e2e.yml's (check-ci-pins.sh asserts the equality) and let the
      # reachability step below vet the value it carries.
      # e7cded80 = harness PR#4 tip: --legacy L2 pricing (#2), the [op_eip1559]
      # declaration (#3) and the mid-chain Jovian parameterization (#4).
      - name: Check out the op-e2e harness (op-stack-e2e-tests)
        uses: actions/checkout@v4
        with:
          repository: FISCO-BCOS/op-stack-e2e-tests
          ref: e7cded80ad98e9c85a1fecc475ce201d55f773ea
          path: .ci-op-e2e-tests

      - name: Download fisco-bcos from L2 unit job
        uses: actions/download-artifact@v4
        with:
          name: fisco-bcos-l2-ubuntu
          path: build/fisco-bcos-air

      - name: Ensure fisco-bcos executable
        run: chmod +x build/fisco-bcos-air/fisco-bcos

      - name: Install C2 system packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            wget python3-dev python3-pip git curl ca-certificates jq zip
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Foundry (optimism contracts-bedrock pin)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Install just (op-deployer build)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
          just --version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          # STEP-SET TWIN of c2-e2e.yml's Set up Go step: same "no go.mod/go.sum in this
          # repository" reasoning (setup-go's cache restore failed with "Some specified paths
          # were not resolved" every run), and the OP monorepo clone it would key on happens
          # later in this job.
          cache: false

      - name: Read OP monorepo pin
        id: op-pin
        run: |
          set -euo pipefail
          COMMIT=$(python3 -c "import json; print(json.load(open('.ci-op-e2e-tests/tools/op-e2e/versions.json'))['op_monorepo']['commit'])")
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      # The pin above is data, and a stale harness ref can carry a wrong one (PR
      # #5615: op_monorepo.commit held the op-revm oracle revision 5f90f749c, an
      # object ethereum-optimism/optimism never had — the job died late, inside the
      # monorepo fetch, on a bare "not our ref"). Vet the value here instead, where
      # the message can name its source. GitHub answers 200 for a commit it serves
      # and 404/422 for one it cannot (rewritten away, or a sha from another repo);
      # any other status is an API hiccup or rate limit, so it only warns.
      - name: Assert the OP monorepo pin is reachable
        run: |
          set -euo pipefail
          COMMIT="${{ steps.op-pin.outputs.commit }}"
          case "${COMMIT}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *)
              echo "::error::op_monorepo.commit read from the harness ref is not a sha: '${COMMIT}'"
              exit 1
              ;;
          esac
          if [ "${#COMMIT}" -ne 40 ]; then
            echo "::error::op_monorepo.commit is ${#COMMIT} chars, want 40: '${COMMIT}'"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/ethereum-optimism/optimism/commits/${COMMIT}")
          case "${code}" in
            200) echo "OP monorepo pin ${COMMIT} is reachable" ;;
            404 | 422)
              echo "::error::op_monorepo.commit=${COMMIT} does not exist in ethereum-optimism/optimism (HTTP ${code}). The harness ref pinned for this job (see the checkout step) carries a bad versions.json — bump the harness ref, do not retry."
              exit 1
              ;;
            *)
              echo "::notice::reachability check inconclusive (HTTP ${code}); continuing"
              ;;
          esac

      - name: Cache OP monorepo + binaries
        id: op-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-op-monorepo
            .ci-c2-bins
          key: c2-op-${{ steps.op-pin.outputs.commit }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build OP stack binaries
        if: steps.op-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-c2-bins
          if [ ! -d .ci-op-monorepo/.git ]; then
            git clone --filter=blob:none https://github.com/ethereum-optimism/optimism .ci-op-monorepo
          fi
          git -C .ci-op-monorepo fetch --depth=1 origin "${{ steps.op-pin.outputs.commit }}" \
            || git -C .ci-op-monorepo fetch origin
          git -C .ci-op-monorepo checkout -q "${{ steps.op-pin.outputs.commit }}"
          # The fetch above falls back to a full fetch, and checkout of a missing
          # object would then take whatever HEAD the clone carried — assert the pin
          # is what actually landed, so a bad pin can never build silently.
          actual=$(git -C .ci-op-monorepo rev-parse HEAD)
          if [ "${actual}" != "${{ steps.op-pin.outputs.commit }}" ]; then
            echo "::error::monorepo checkout is ${actual}, pin is ${{ steps.op-pin.outputs.commit }} (cache key and binaries would be attributed to the wrong revision)"
            exit 1
          fi
          git -C .ci-op-monorepo submodule update --init superchain-registry
          bash .ci-op-monorepo/op-core/superchain/sync-superchain.sh
          # Plain go build omits artifacts.tzst; op-deployer apply fails without just build.
          # STEP-SET TWIN of c2-e2e.yml's Build OP stack binaries step, including this forge-pin
          # assertion: this job builds the binaries itself, so the e2e step runs with
          # SKIP_OP_BUILD=1 and tools/.ci/c2-e2e.sh's ensure_op_forge never executes.
          MISE_FORGE=$(yq -r '.tools.forge' .ci-op-monorepo/mise.toml 2>/dev/null || true)
          if [ -n "${MISE_FORGE}" ] && [ "${MISE_FORGE}" != "null" ]; then
            forge --version | grep -q "${MISE_FORGE}" || {
              echo "ERROR: forge $(forge --version) is not the mise.toml pin ${MISE_FORGE}"; exit 1; }
          fi
          (cd .ci-op-monorepo/op-deployer && just build)
          cp .ci-op-monorepo/op-deployer/bin/op-deployer "$GITHUB_WORKSPACE/.ci-c2-bins/op-deployer"
          (cd .ci-op-monorepo && go build -o "$GITHUB_WORKSPACE/.ci-c2-bins/op-batcher" ./op-batcher/cmd)
          (cd .ci-op-monorepo && go build -o "$GITHUB_WORKSPACE/.ci-c2-bins/op-node" ./op-node/cmd)

      - name: Fetch pinned Solidity deps
        run: bash tools/.ci/fetch-l2-contract-deps.sh

      - name: Forge build L2 contracts
        run: forge build
        working-directory: bcos-l2-contracts

      - name: Run C2 ephemeral e2e
        run: SKIP_OP_BUILD=1 bash tools/.ci/c2-e2e.sh
        env:
          REPO_ROOT: ${{ github.workspace }}
          BIN_DIR: ${{ github.workspace }}/.ci-c2-bins
          FISCO_BIN: ${{ github.workspace }}/build/fisco-bcos-air/fisco-bcos
          SKIP_FISCO_BUILD: "1"

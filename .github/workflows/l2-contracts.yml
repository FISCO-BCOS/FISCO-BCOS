name: L2 contracts
# Forge build/test + storage-layout drift gate for the OP-Stack L2 Solidity
# suite, plus the build-allocs.py pytest suite. Path-filtered so it only runs
# when the L2 artifacts (or this workflow) change — the heavy C++ matrix in
# workflow.yml stays untouched.
on:
  push:
    paths:
      - "bcos-l2-contracts/**"
      - "tools/opstack-genesis/**"
      - ".github/workflows/l2-contracts.yml"
  pull_request:
    paths:
      - "bcos-l2-contracts/**"
      - "tools/opstack-genesis/**"
      - ".github/workflows/l2-contracts.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: forge build/test + storage-layout drift gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bcos-l2-contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        # Pinned to 1.5.1: golden storage-layout fixtures and --json output
        # shape were generated by this version. Do not upgrade without
        # regenerating storage-layout/*.json and reviewing the diff.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1
      - name: Fetch pinned Solidity deps
        # SystemConfig / L2ValidatorSet import @openzeppelin (v4.7.3). The
        # storage-layout gate below requires the EXACT OZ pinned in
        # op-fork-pin.toml — a different OZ point release can shift an inherited
        # slot — so clone at those SHAs rather than `forge install` (which pulls
        # a moving tag and, here, cannot register a submodule inside the
        # git-ignored lib/). forge-std is test-only and layout-irrelevant, so a
        # shallow default-branch clone is fine.
        #
        # The OZ SHAs are parsed from op-fork-pin.toml and validated as 40-char
        # lowercase hex before use, so a tampered pin file cannot splice shell
        # metacharacters into the clone commands.
        run: |
          set -euo pipefail
          mkdir -p lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          # Normalize to lowercase first: git accepts uppercase hex SHAs (a
          # GitHub-UI copy-paste can produce them), so enforce the lowercase
          # convention by folding rather than rejecting with a confusing error.
          oz=$(grep -E '^"openzeppelin-contracts"' op-fork-pin.toml | awk -F'"' '{print $4}' | tr 'A-F' 'a-f')
          ozu=$(grep -E '^"openzeppelin-contracts-upgradeable"' op-fork-pin.toml | awk -F'"' '{print $4}' | tr 'A-F' 'a-f')
          for sha in "$oz" "$ozu"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::op-fork-pin.toml OZ dep SHA is not a 40-char hex SHA: '${sha}'"; exit 1
            fi
          done
          git clone https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git -C lib/openzeppelin-contracts checkout "$oz"
          git clone https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable lib/openzeppelin-contracts-upgradeable
          git -C lib/openzeppelin-contracts-upgradeable checkout "$ozu"
      - name: Build self-written predeploys (src/)
        run: forge build
      - name: Read pinned OP fork commit
        # Single source of truth for the upstream pin lives in
        # bcos-l2-contracts/op-fork-pin.toml. Bumping that file (commit +
        # date_pinned + dep SHAs) is the entire upgrade SOP — see
        # docs/runbook-op-fork-upgrade.md.
        #
        # The parsed value flows into later `run:` blocks via env (NOT direct
        # `${{ }}` expansion) and is validated as a 40-char hex SHA up front,
        # so a malicious PR cannot smuggle shell metacharacters via this file.
        id: pin
        run: |
          set -euo pipefail
          # Lowercase-fold before validating (same rationale as the OZ dep
          # step: uppercase hex SHAs are valid to git, so normalize instead of
          # rejecting them with a misleading "not hex" error).
          COMMIT=$(grep -E '^commit' op-fork-pin.toml | awk -F'"' '{print $2}' | tr 'A-F' 'a-f')
          if [ -z "$COMMIT" ]; then
            echo "::error::failed to parse 'commit' from op-fork-pin.toml"; exit 1
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::op-fork-pin.toml 'commit' is not a 40-char hex SHA: ${COMMIT}"
            exit 1
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
      - name: Cache pinned OP fork tree
        # /tmp/op-fork is content-addressed by the pinned commit, so a re-run
        # at the same pin re-uses the clone (saves ~30s + bandwidth). Safe to
        # interpolate the commit here: it is consumed by the cache action's
        # `key:` field (no shell), and the previous step already validated it
        # is a 40-char hex SHA.
        id: opcache
        uses: actions/cache@v4
        with:
          path: /tmp/op-fork
          key: op-fork-${{ steps.pin.outputs.commit }}
      - name: Clone pinned OP fork
        if: steps.opcache.outputs.cache-hit != 'true'
        # `--filter=blob:none` makes the clone partial: history metadata only,
        # blobs fetched lazily on checkout. submodule init is restricted to
        # contracts-bedrock/lib (4 deps: OZ × 2, solady, solmate); we do not
        # need op-node / op-batcher / etc.
        #
        # The commit is passed via env (not inline `${{ }}` in run:) so the
        # runner does not splice a repo-controlled string into the shell.
        env:
          OP_FORK_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ethereum-optimism/optimism /tmp/op-fork
          git -C /tmp/op-fork checkout "$OP_FORK_COMMIT"
          git -C /tmp/op-fork submodule update --init --recursive --depth=1 \
              packages/contracts-bedrock/lib
      - name: Build pinned OP fork tree
        # cd out of the bcos-l2-contracts default working-directory: the OP
        # contracts-bedrock has its own foundry.toml + remappings + 0.8.15
        # pragma; forge resolves solc per file's pragma, so the 0.8.15 OP
        # sources and our 0.8.25 src/ are separate compile units.
        run: |
          cd /tmp/op-fork/packages/contracts-bedrock
          forge build
      - name: Run Foundry tests
        run: forge test -vvv
      - name: Storage-layout drift gate
        # Hard gate: regenerate the layout for each genesis predeploy and diff
        # against the checked-in golden fixture. --json is MANDATORY in forge
        # 1.5.1 — plain output is an ASCII table that does not diff stably.
        #
        # A real storage migration (a slot, offset, label, or type *shape*
        # change) silently breaks genesis allocs, so any such drift fails the
        # build and forces an explicit fixture regen + migration review.
        #
        # The diff is normalized first: forge embeds compiler-internal AST node
        # ids in the JSON (`astId`, and the numeric suffix inside struct type
        # identifiers like `t_struct(Validator)319_storage`). Those ids renumber
        # on any unrelated recompile (e.g. once forge-std is installed) without
        # the storage layout changing, so a raw diff false-positives. We drop
        # `astId` and canonicalize the `)<N>_storage` suffix, keeping the
        # load-bearing fields (label / slot / offset / type shape).
        run: |
          set -euo pipefail
          norm() {
            jq -S 'del(.. | .astId?)' "$1" \
              | sed -E 's/(t_struct\([A-Za-z0-9_.]+\))[0-9]+(_storage)/\1\2/g'
          }
          fail=0
          for c in SystemConfig L2ValidatorSet; do
            forge inspect "$c" storage-layout --json > "/tmp/${c}.layout.json"
            if ! diff -u <(norm "storage-layout/${c}.json") <(norm "/tmp/${c}.layout.json"); then
              echo "::error::storage-layout drift detected for ${c}; if intentional, regenerate storage-layout/${c}.json (forge inspect ${c} storage-layout --json) and document the migration"
              fail=1
            fi
          done
          exit "$fail"

  genesis-tooling:
    name: build-allocs.py pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/opstack-genesis
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        # build-allocs.py imports pyyaml at module load, so the pytest suite
        # (which loads it by path) needs pyyaml too. pytest runs the suite.
        run: python3 -m pip install --upgrade pip pyyaml pytest
      - name: Run pytest
        run: python3 -m pytest test_build_allocs.py -v

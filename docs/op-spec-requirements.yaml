# OP Stack 执行客户端规范需求条目
# 来源: specs.optimism.io/protocol/exec-engine.html (Isthmus/Jovian 时期)
# 提取日期: 2026-08-19
# 版本: v1.0

扇区: ENG  # Engine API
条目:

  # ---- engine_exchangeCapabilities ----
  - id: "ENG-CAP-001"
    section: "engine_exchangeCapabilities"
    requirement: "Client software MUST return the list of supported Engine API methods"
    severity: "MUST"
    spec_ref: "#engine-exchangecapabilities"

  - id: "ENG-CAP-002"
    section: "engine_exchangeCapabilities"
    requirement: "OP-mode MUST advertise V4 capabilities (Isthmus+)"
    severity: "MUST"
    spec_ref: "#engine-exchangecapabilities"

  # ---- engine_forkchoiceUpdatedV1/V2/V3/V4 ----
  - id: "ENG-FCU-001"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST update the forkchoice state (head/safe/finalized)"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-002"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST validate safeBlockHash <= headBlockHash"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-003"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST validate finalizedBlockHash <= headBlockHash"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-004"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST return -38002 InvalidForkchoiceState if headBlockHash is unknown"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-005"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST return -38003 InvalidPayloadAttributes if attributes are invalid"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-006"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST return -38005 UnsupportedFork if timestamp is out of fork window"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-007"
    section: "engine_forkchoiceUpdated"
    requirement: "Client software MUST return -38006 TooDeepReorg if reorg depth exceeds limitation"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-008"
    section: "engine_forkchoiceUpdated"
    requirement: "OP-mode: forkchoice state MUST be updated even when payload attributes are invalid"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-009"
    section: "engine_forkchoiceUpdated"
    requirement: "OP-mode: MUST refuse payload attributes with -38003 (attribute-driven building not supported)"
    severity: "SHOULD"
    spec_ref: "#forkchoice-updated"

  - id: "ENG-FCU-010"
    section: "engine_forkchoiceUpdated"
    requirement: "Payload ID MUST be deterministic (derived from attributes + parent hash)"
    severity: "MUST"
    spec_ref: "#payload-id"

  - id: "ENG-FCU-011"
    section: "engine_forkchoiceUpdated"
    requirement: "Isthmus+ payloads MUST use V4 (V3 attrs are ABI-compatible with V4)"
    severity: "MUST"
    spec_ref: "#forkchoice-updated"

  # ---- engine_newPayloadV1/V2/V3/V4 ----
  - id: "ENG-NP-001"
    section: "engine_newPayload"
    requirement: "Client software MUST validate ExecutionPayload fields (types, ranges)"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-002"
    section: "engine_newPayload"
    requirement: "Client software MUST verify blockHash matches reconstructed 21-field RLP header"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-003"
    section: "engine_newPayload"
    requirement: "Client software MUST return SYNCING if parentHash is unknown"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-004"
    section: "engine_newPayload"
    requirement: "Client software MUST validate blockNumber = parentNumber + 1"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-005"
    section: "engine_newPayload"
    requirement: "Client software MUST validate timestamp > parent timestamp"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-006"
    section: "engine_newPayload"
    requirement: "Client software MUST validate baseFeePerGas matches CalcBaseFee(parent)"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-007"
    section: "engine_newPayload"
    requirement: "Client software MUST return VALID for already-known blocks (re-delivery short-circuit)"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-008"
    section: "engine_newPayload"
    requirement: "Client software MUST reject non-tip payloads (parent must be current chain tip)"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-009"
    section: "engine_newPayload"
    requirement: "Client software MUST execute the block and verify 6-way commitments"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-010"
    section: "engine_newPayload"
    requirement: "Client software MUST commit the block on VALID verdict"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-011"
    section: "engine_newPayload"
    requirement: "Isthmus+ payloads MUST use engine_newPayloadV4"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-012"
    section: "engine_newPayload"
    requirement: "OP-mode MUST reject pre-Isthmus payloads with -38005"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-013"
    section: "engine_newPayload"
    requirement: "Client software MUST return INVALID (not -32603) for consensus-level rejections"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-014"
    section: "engine_newPayload"
    requirement: "Client software MUST return -32603 for internal errors (not INVALID)"
    severity: "MUST"
    spec_ref: "#new-payload"

  - id: "ENG-NP-015"
    section: "engine_newPayload"
    requirement: "withdrawalsRoot MUST be present in Isthmus+ payloads"
    severity: "MUST"
    spec_ref: "#new-payload"

  # ---- engine_getPayloadV1/V2/V3/V4 ----
  - id: "ENG-GP-001"
    section: "engine_getPayload"
    requirement: "Client software MUST return the cached payload by payloadId"
    severity: "MUST"
    spec_ref: "#get-payload"

  - id: "ENG-GP-002"
    section: "engine_getPayload"
    requirement: "Client software MUST return -38001 UnknownPayload if payloadId is not found"
    severity: "MUST"
    spec_ref: "#get-payload"

  - id: "ENG-GP-003"
    section: "engine_getPayload"
    requirement: "Client software MUST return -38005 IncompatiblePayloadVersion if versions mismatch"
    severity: "MUST"
    spec_ref: "#get-payload"

---

扇区: BLK  # 块执行
条目:

  # ---- 预区块步骤 ----
  - id: "BLK-PRE-001"
    section: "preBlockOpSteps"
    requirement: "Block MUST start with system_call_block_start (set L1 attributes)"
    severity: "MUST"
    spec_ref: "#system-contracts"

  - id: "BLK-PRE-002"
    section: "preBlockOpSteps"
    requirement: "Block MUST construct RecentBlockHashes for EVM BLOCKHASH opcode"
    severity: "MUST"
    spec_ref: "#block-hash"

  - id: "BLK-PRE-003"
    section: "preBlockOpSteps"
    requirement: "Block MUST have a deposit transaction as the first transaction"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-PRE-004"
    section: "preBlockOpSteps"
    requirement: "Jovian activation block MUST be deposits-only"
    severity: "MUST"
    spec_ref: "#jovian"

  - id: "BLK-PRE-005"
    section: "preBlockOpSteps"
    requirement: "DA footprint gas scalar MUST be extracted from L1 attributes deposit"
    severity: "MUST"
    spec_ref: "#jovian"

  # ---- Deposit 交易 ----
  - id: "BLK-DEP-001"
    section: "depositTx"
    requirement: "Deposit envelope MUST start with 0x7E type byte"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-002"
    section: "depositTx"
    requirement: "Deposit envelope body MUST be a valid RLP list"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-003"
    section: "depositTx"
    requirement: "Deposit fields MUST be re-derived from the signed envelope, not from tars mirrors"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-004"
    section: "depositTx"
    requirement: "Deposit MUST skip buyGas (intrinsic gas deducted differently)"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-005"
    section: "depositTx"
    requirement: "Deposit mint MUST be added unconditionally to from balance (when present)"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-006"
    section: "depositTx"
    requirement: "Deposit failure MUST retain mint and force-increment nonce"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-007"
    section: "depositTx"
    requirement: "is_system_tx MUST be false after Regolith"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  - id: "BLK-DEP-008"
    section: "depositTx"
    requirement: "is_system_tx=true MUST throw block-level error"
    severity: "MUST"
    spec_ref: "#deposit-tx"

  # ---- 普通交易 ----
  - id: "BLK-TX-001"
    section: "normalTx"
    requirement: "Transaction MUST validate chainId matches node chainId (except legacy unprotected)"
    severity: "MUST"
    spec_ref: "#transaction-validation"

  - id: "BLK-TX-002"
    section: "normalTx"
    requirement: "Transaction MUST reject blob transactions"
    severity: "MUST"
    spec_ref: "#transaction-validation"

  - id: "BLK-TX-003"
    section: "normalTx"
    requirement: "Balance cap = gasLimit*maxGasPrice + value + l1Cost + operatorCost(gasLimit)"
    severity: "MUST"
    spec_ref: "#transaction-validation"

  - id: "BLK-TX-004"
    section: "normalTx"
    requirement: "buyGas MUST include l1Cost + operatorCost(gasLimit)"
    severity: "MUST"
    spec_ref: "#transaction-validation"

  # ---- 块终结 ----
  - id: "BLK-FIN-001"
    section: "blockFinalize"
    requirement: "Block finalize MUST NOT include block reward (no ommers)"
    severity: "MUST"
    spec_ref: "#block-finalization"

  - id: "BLK-FIN-002"
    section: "blockFinalize"
    requirement: "Prague requests MUST be suppressed (disable_prague_requests)"
    severity: "MUST"
    spec_ref: "#block-finalization"

  - id: "BLK-FIN-003"
    section: "blockFinalize"
    requirement: "withdrawalsRoot MUST be the MessagePasser storage root"
    severity: "MUST"
    spec_ref: "#withdrawals-root"

  - id: "BLK-FIN-004"
    section: "blockFinalize"
    requirement: "requestsHash = sha256('') for Isthmus+"
    severity: "MUST"
    spec_ref: "#requests-hash"

  # ---- 承诺比较 ----
  - id: "BLK-CMT-001"
    section: "commitments"
    requirement: "6-way comparison: receiptsRoot/logsBloom/withdrawalsRoot/stateRoot/gasUsed/txRoot"
    severity: "MUST"
    spec_ref: "#payload-validation"

  - id: "BLK-CMT-002"
    section: "commitments"
    requirement: "Jovian+: blobGasUsed = DA footprint (Σ over non-deposit receipts)"
    severity: "MUST"
    spec_ref: "#jovian"

---

扇区: PRE  # 预部署合约
条目:

  - id: "PRE-ADR-001"
    section: "predeploys"
    requirement: "L1Block at 0x4200000000000000000000000000000000000015"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-002"
    section: "predeploys"
    requirement: "GasPriceOracle at 0x420000000000000000000000000000000000000F"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-003"
    section: "predeploys"
    requirement: "L2ToL1MessagePasser at 0x4200000000000000000000000000000000000016"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-004"
    section: "predeploys"
    requirement: "SequencerFeeVault at 0x4200000000000000000000000000000000000011"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-005"
    section: "predeploys"
    requirement: "BaseFeeVault at 0x4200000000000000000000000000000000000019"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-006"
    section: "predeploys"
    requirement: "L1FeeVault at 0x420000000000000000000000000000000000001A"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-007"
    section: "predeploys"
    requirement: "OperatorFeeVault at 0x420000000000000000000000000000000000001B"
    severity: "MUST"
    spec_ref: "#predeploys"

  - id: "PRE-ADR-008"
    section: "predeploys"
    requirement: "WETH at 0x4200000000000000000000000000000000000006"
    severity: "SHOULD"
    spec_ref: "#predeploys"

  - id: "PRE-SLOT-001"
    section: "predeploys"
    requirement: "L1Block slot 1 = l1_base_fee (whole slot)"
    severity: "MUST"
    spec_ref: "#l1block"

  - id: "PRE-SLOT-002"
    section: "predeploys"
    requirement: "L1Block slot 3 = packed(base_fee_scalar[16:20], blob_base_fee_scalar[20:24])"
    severity: "MUST"
    spec_ref: "#l1block"

  - id: "PRE-SLOT-003"
    section: "predeploys"
    requirement: "L1Block slot 7 = blob_base_fee (whole slot)"
    severity: "MUST"
    spec_ref: "#l1block"

  - id: "PRE-SLOT-004"
    section: "predeploys"
    requirement: "L1Block slot 8 = packed(operator_fee_scalar[20:24], operator_fee_constant[24:32], da_footprint_gas_scalar[18:20])"
    severity: "MUST"
    spec_ref: "#l1block"

  - id: "PRE-SYS-001"
    section: "predeploys"
    requirement: "system_call_block_start MUST set L1 attributes via deposit to L1Block"
    severity: "MUST"
    spec_ref: "#system-contracts"

  - id: "PRE-SYS-002"
    section: "predeploys"
    requirement: "system_call_block_end MUST collect withdrawals (Isthmus+)"
    severity: "MUST"
    spec_ref: "#system-contracts"

---

扇区: FEE  # 费用计算
条目:

  # ---- L1 数据费用 ----
  - id: "FEE-L1-001"
    section: "l1DataFee"
    requirement: "Ecotone formula: l1Cost = (l1BaseFee * baseFeeScalar + blobBaseFee * blobBaseFeeScalar) * calldataGas"
    severity: "MUST"
    spec_ref: "#l1-data-fee"

  - id: "FEE-L1-002"
    section: "l1DataFee"
    requirement: "Fjord formula: l1Cost = (l1BaseFee * baseFeeScalar + blobBaseFee * blobBaseFeeScalar) * max(flzLen, 1)"
    severity: "MUST"
    spec_ref: "#l1-data-fee"

  - id: "FEE-L1-003"
    section: "l1DataFee"
    requirement: "Ecotone calldataGas = zeroes*4 + ones*16"
    severity: "MUST"
    spec_ref: "#l1-data-fee"

  - id: "FEE-L1-004"
    section: "l1DataFee"
    requirement: "Fjord FastLZ compression for l1GasUsed"
    severity: "MUST"
    spec_ref: "#l1-data-fee"

  # ---- 运营者费用 ----
  - id: "FEE-OP-001"
    section: "operatorFee"
    requirement: "Isthmus: operatorCost = operatorFeeScalar * gasUsed / 1e6 + operatorFeeConstant"
    severity: "MUST"
    spec_ref: "#operator-fee"

  - id: "FEE-OP-002"
    section: "operatorFee"
    requirement: "Jovian: operatorCost = operatorFeeScalar * gasUsed / 1e4 + operatorFeeConstant (×100)"
    severity: "MUST"
    spec_ref: "#operator-fee"

  - id: "FEE-OP-003"
    section: "operatorFee"
    requirement: "Operator fee MUST be routed to OperatorFeeVault"
    severity: "MUST"
    spec_ref: "#operator-fee"

  # ---- DA 占用 ----
  - id: "FEE-DA-001"
    section: "daFootprint"
    requirement: "Jovian: daFootprint = da_footprint_gas_scalar * flzLen"
    severity: "MUST"
    spec_ref: "#jovian"

  - id: "FEE-DA-002"
    section: "daFootprint"
    requirement: "DA footprint MUST be stored in blobGasUsed header slot"
    severity: "MUST"
    spec_ref: "#jovian"

  # ---- EIP-1559 ----
  - id: "FEE-EIP-001"
    section: "eip1559"
    requirement: "CalcBaseFee MUST use Holocene extraData (9B: version + denominator + elasticity)"
    severity: "MUST"
    spec_ref: "#eip1559"

  - id: "FEE-EIP-002"
    section: "eip1559"
    requirement: "Jovian extraData MUST be 17B (version=1 + denominator + elasticity + minBaseFee)"
    severity: "MUST"
    spec_ref: "#eip1559"

  - id: "FEE-EIP-003"
    section: "eip1559"
    requirement: "baseFeePerGas MUST match CalcBaseFee(parent) in newPayload"
    severity: "MUST"
    spec_ref: "#eip1559"

  - id: "FEE-EIP-004"
    section: "eip1559"
    requirement: "Jovian: blobGasUsed substitution in CalcBaseFee"
    severity: "MUST"
    spec_ref: "#eip1559"

  - id: "FEE-EIP-005"
    section: "eip1559"
    requirement: "Jovian: minBaseFee floor in CalcBaseFee"
    severity: "MUST"
    spec_ref: "#eip1559"

  # ---- 费用路由 ----
  - id: "FEE-RT-001"
    section: "feeRouting"
    requirement: "Base fee MUST go to BaseFeeVault"
    severity: "MUST"
    spec_ref: "#fee-vaults"

  - id: "FEE-RT-002"
    section: "feeRouting"
    requirement: "L1 data fee MUST go to L1FeeVault"
    severity: "MUST"
    spec_ref: "#fee-vaults"

  - id: "FEE-RT-003"
    section: "feeRouting"
    requirement: "Priority fee (tip) MUST go to SequencerFeeVault"
    severity: "MUST"
    spec_ref: "#fee-vaults"

---

扇区: RCP  # Receipt 编码
条目:

  - id: "RCP-ENC-001"
    section: "receiptEncoding"
    requirement: "Deposit receipt: 0x7E || rlp([status, cumGas, bloom, logs, depositNonce, receiptVersion])"
    severity: "MUST"
    spec_ref: "#receipt-encoding"

  - id: "RCP-ENC-002"
    section: "receiptEncoding"
    requirement: "Normal receipt: typed_prefix || rlp([status, cumGas, bloom, logs])"
    severity: "MUST"
    spec_ref: "#receipt-encoding"

  - id: "RCP-META-001"
    section: "receiptMeta"
    requirement: "Receipt MUST include l1_gas_price (= fee.l1_base_fee)"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-002"
    section: "receiptMeta"
    requirement: "Receipt MUST include l1_blob_base_fee"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-003"
    section: "receiptMeta"
    requirement: "Receipt MUST include l1_base_fee_scalar"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-004"
    section: "receiptMeta"
    requirement: "Receipt MUST include l1_blob_base_fee_scalar"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-005"
    section: "receiptMeta"
    requirement: "Receipt MUST include l1_fee (= l1Cost)"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-006"
    section: "receiptMeta"
    requirement: "Fjord+ receipt MUST include l1_gas_used"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-007"
    section: "receiptMeta"
    requirement: "Isthmus+ receipt MUST include operator_fee_scalar and operator_fee_constant"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-008"
    section: "receiptMeta"
    requirement: "Jovian+ receipt MUST include da_footprint_gas_scalar and da_footprint"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-META-009"
    section: "receiptMeta"
    requirement: "Receipt MUST include effective_gas_price"
    severity: "MUST"
    spec_ref: "#receipt-meta"

  - id: "RCP-ROOT-001"
    section: "receiptRoot"
    requirement: "Receipts root MUST use op-geth Receipts.EncodeIndex semantics"
    severity: "MUST"
    spec_ref: "#receipt-root"

---

扇区: STA  # 状态管理
条目:

  - id: "STA-ROOT-001"
    section: "stateRoot"
    requirement: "State root MUST be computed over MPT (not XOR)"
    severity: "MUST"
    spec_ref: "#state-root"

  - id: "STA-ROOT-002"
    section: "txRoot"
    requirement: "Transaction root MUST be MPT over raw EIP-2718 envelopes (key=rlp(index), value=raw)"
    severity: "MUST"
    spec_ref: "#tx-root"

  - id: "STA-ROOT-003"
    section: "withdrawalsRoot"
    requirement: "Isthmus+: withdrawalsRoot MUST be the L2ToL1MessagePasser storage root"
    severity: "MUST"
    spec_ref: "#withdrawals-root"

  - id: "STA-DIFF-001"
    section: "stateDiff"
    requirement: "State diff MUST be applied atomically after block execution"
    severity: "MUST"
    spec_ref: "#state-management"

  - id: "STA-ERR-001"
    section: "sharedError"
    requirement: "Block-wide storage error slot MUST poison the block (dbErr analogue)"
    severity: "MUST"
    spec_ref: "#state-management"

---

扇区: FRK  # 硬分叉
条目:

  - id: "FRK-SCH-001"
    section: "forkSchedule"
    requirement: "Ecotone = Cancun (EVMC_CANCUN)"
    severity: "MUST"
    spec_ref: "#fork-schedule"

  - id: "FRK-SCH-002"
    section: "forkSchedule"
    requirement: "Fjord = Cancun (EVMC_CANCUN)"
    severity: "MUST"
    spec_ref: "#fork-schedule"

  - id: "FRK-SCH-003"
    section: "forkSchedule"
    requirement: "Granite = Cancun (EVMC_CANCUN)"
    severity: "MUST"
    spec_ref: "#fork-schedule"

  - id: "FRK-SCH-004"
    section: "forkSchedule"
    requirement: "Holocene = Cancun (EVMC_CANCUN)"
    severity: "MUST"
    spec_ref: "#fork-schedule"

  - id: "FRK-SCH-005"
    section: "forkSchedule"
    requirement: "Isthmus = Prague (EVMC_PRAGUE)"
    severity: "MUST"
    spec_ref: "#fork-schedule"

  - id: "FRK-SCH-006"
    section: "forkSchedule"
    requirement: "Jovian = Prague (EVMC_PRAGUE)"
    severity: "MUST"
    spec_ref: "#fork-schedule"

  - id: "FRK-SEL-001"
    section: "forkSelection"
    requirement: "Fork selection MUST be feature-flag driven (not timestamp-based)"
    severity: "MUST"

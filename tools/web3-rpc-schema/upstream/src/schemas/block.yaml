Block:
  title: Block object
  type: object
  required:
    - hash
    - parentHash
    - sha3Uncles
    - miner
    - stateRoot
    - transactionsRoot
    - receiptsRoot
    - logsBloom
    - number
    - gasLimit
    - gasUsed
    - timestamp
    - extraData
    - mixHash
    - nonce
    - size
    - transactions
    - uncles
  properties:
    hash:
      title: Hash
      $ref: '#/components/schemas/hash32'
    parentHash:
      title: Parent block hash
      $ref: '#/components/schemas/hash32'
    sha3Uncles:
      title: Ommers hash
      $ref: '#/components/schemas/hash32'
    miner:
      title: Coinbase
      $ref: '#/components/schemas/address'
    stateRoot:
      title: State root
      $ref: '#/components/schemas/hash32'
    transactionsRoot:
      title: Transactions root
      $ref: '#/components/schemas/hash32'
    receiptsRoot:
      title: Receipts root
      $ref: '#/components/schemas/hash32'
    logsBloom:
      title: Bloom filter
      $ref: '#/components/schemas/bytes256'
    difficulty:
      title: Difficulty
      $ref: '#/components/schemas/uint'
    number:
      title: Number
      $ref: '#/components/schemas/uint'
    gasLimit:
      title: Gas limit
      $ref: '#/components/schemas/uint'
    gasUsed:
      title: Gas used
      $ref: '#/components/schemas/uint'
    timestamp:
      title: Timestamp
      $ref: '#/components/schemas/uint'
    extraData:
      title: Extra data
      $ref: '#/components/schemas/bytes'
    mixHash:
      title: Mix hash
      $ref: '#/components/schemas/hash32'
    nonce:
      title: Nonce
      $ref: '#/components/schemas/bytes8'
    baseFeePerGas:
      title: Base fee per gas
      $ref: '#/components/schemas/uint'
    withdrawalsRoot:
      title: Withdrawals root
      $ref: '#/components/schemas/hash32'
    blobGasUsed:
      title: Blob gas used
      $ref: '#/components/schemas/uint'
    excessBlobGas:
      title: Excess blob gas
      $ref: '#/components/schemas/uint'
    parentBeaconBlockRoot:
      title: Parent Beacon Block Root
      $ref: '#/components/schemas/hash32'
    size:
      title: Block size
      $ref: '#/components/schemas/uint'
    transactions:
      anyOf:
        - title: Transaction hashes
          type: array
          items:
            $ref: '#/components/schemas/hash32'

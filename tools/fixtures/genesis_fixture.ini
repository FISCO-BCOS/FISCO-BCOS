; Shared Eth-lane genesis fixture: [alloc.0] + [eth_genesis_header], appended
; verbatim to config.genesis by BOTH tools/engine_integration_test.sh and
; tools/.ci/ci_check_eth_executor.sh (review F29 — one copy, so the state_root/hash
; consensus literals cannot drift between the two harnesses).
;
; The Ethereum lane (executor_version >= 2) REQUIRES a non-empty [alloc.*] section
; and an [eth_genesis_header] section (NodeConfig::validateL2Invariants): the node
; cross-checks state_root against the MPT root it derives from the [alloc.*] sections
; and hash against keccak256(rlp(header)) of the other 21 fields.
;
; state_root/hash are valid ONLY for exactly this one alloc; if the alloc changes,
; regenerate both with tools/opstack-genesis/gen_eth_header_fixture.py.
